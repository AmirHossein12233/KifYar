<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>کیف پول | KifYar</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Tahoma, Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .topbar h1 {
            margin: 0;
            font-size: 24px;
        }

        .btn {
            border: 0;
            border-radius: 10px;
            padding: 11px 16px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            background: #222;
            color: white;
        }

        .btn-light {
            background: white;
            color: #222;
            border: 1px solid #ddd;
        }

        .simulation {
            background: #fff3cd;
            border: 1px solid #ffe08a;
            color: #7a5a00;
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 18px;
            font-size: 13px;
        }

        .notification-area {
            display: none;
            margin-bottom: 18px;
        }

        .notification {
            padding: 15px;
            border-radius: 13px;
            background: white;
            border-right: 5px solid #555;
            box-shadow: 0 5px 18px rgba(0,0,0,.06);
        }

        .notification.show {
            display: block;
        }

        .notification-title {
            font-weight: bold;
            margin-bottom: 6px;
        }

        .notification-text {
            font-size: 13px;
            color: #666;
            line-height: 1.8;
        }

        .notification-close {
            float: left;
            border: 0;
            background: transparent;
            cursor: pointer;
            font-size: 18px;
        }

        .notification.completed {
            border-right-color: #28a745;
        }

        .notification.failed,
        .notification.cancelled {
            border-right-color: #dc3545;
        }

        .notification.pending {
            border-right-color: #ffc107;
        }

        .balance-card {
            background: white;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,.06);
            margin-bottom: 20px;
        }

        .balance-label {
            color: #777;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .balance {
            font-size: 32px;
            font-weight: bold;
        }

        .unit {
            font-size: 16px;
            color: #666;
            margin-right: 5px;
        }

        .section {
            background: white;
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,.05);
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .loading,
        .empty,
        .error {
            padding: 20px;
            text-align: center;
            border-radius: 12px;
            background: #f7f7f7;
            color: #777;
        }

        .error {
            background: #fff0f0;
            color: #b00020;
        }

        .transfer-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .transfer {
            background: #fafafa;
            border: 1px solid #e7e7e7;
            border-radius: 14px;
            padding: 16px;
            cursor: pointer;
            transition: .2s;
        }

        .transfer:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,.07);
            border-color: #ccc;
        }

        .transfer.changed {
            animation: changedAnimation 1.2s ease;
        }

        @keyframes changedAnimation {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.015);
            }

            100% {
                transform: scale(1);
            }
        }

        .transfer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .transfer-title {
            font-weight: bold;
        }

        .transfer-amount {
            font-weight: bold;
        }

        .transfer-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 7px;
            color: #666;
            font-size: 13px;
        }

        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-completed {
            background: #d4edda;
            color: #155724;
        }

        .status-failed,
        .status-cancelled {
            background: #f8d7da;
            color: #721c24;
        }

        .refund-note {
            margin-top: 10px;
            padding: 9px;
            border-radius: 8px;
            background: #e8f5e9;
            color: #256029;
            font-size: 12px;
        }

        .click-hint {
            margin-top: 8px;
            color: #888;
            font-size: 11px;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.55);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 9999;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            width: 100%;
            max-width: 550px;
            max-height: 90vh;
            overflow-y: auto;
            background: white;
            border-radius: 20px;
            padding: 22px;
            box-shadow: 0 20px 60px rgba(0,0,0,.25);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 20px;
        }

        .close-btn {
            width: 38px;
            height: 38px;
            border: 0;
            border-radius: 10px;
            background: #f1f1f1;
            cursor: pointer;
            font-size: 20px;
        }

        .detail-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            padding: 12px;
            background: #f8f8f8;
            border-radius: 10px;
        }

        .detail-label {
            color: #777;
            font-size: 13px;
        }

        .detail-value {
            font-weight: bold;
            text-align: left;
            direction: ltr;
            word-break: break-word;
        }

        .modal-loading {
            text-align: center;
            padding: 30px 10px;
            color: #777;
        }

        .modal-error {
            background: #fff0f0;
            color: #b00020;
            padding: 14px;
            border-radius: 10px;
            text-align: center;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .balance {
                font-size: 26px;
            }

            .transfer-info {
                grid-template-columns: 1fr;
            }

            .transfer-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .modal {
                padding: 17px;
                border-radius: 16px;
            }

            .detail-row {
                flex-direction: column;
                gap: 5px;
            }

            .detail-value {
                text-align: right;
                direction: rtl;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="topbar">

        <h1>کیف پول من</h1>

        <div>
            <button class="btn btn-light" onclick="refreshWallet()">
                بروزرسانی
            </button>

            <button class="btn" onclick="goProfile()">
                پروفایل
            </button>
        </div>

    </div>

    <div class="simulation">
        ⚠️ این سیستم فعلاً شبیه‌سازی است. انتقال به کارت بانکی واقعی انجام نمی‌شود.
    </div>

    <div id="notificationArea" class="notification-area">

        <div id="notification" class="notification">

            <button
                class="notification-close"
                onclick="hideNotification()"
            >
                ×
            </button>

            <div id="notificationTitle" class="notification-title"></div>

            <div id="notificationText" class="notification-text"></div>

        </div>

    </div>

    <div class="balance-card">

        <div class="balance-label">
            موجودی فعلی
        </div>

        <div>
            <span id="balance" class="balance">
                در حال بارگذاری...
            </span>

            <span class="unit">
                تومان
            </span>
        </div>

    </div>

    <div class="section">

        <div class="section-title">
            درخواست‌های انتقال به کارت
        </div>

        <div id="transferList" class="transfer-list">

            <div class="loading">
                در حال دریافت اطلاعات...
            </div>

        </div>

    </div>

</div>


<div id="modalOverlay" class="modal-overlay">

    <div class="modal">

        <div class="modal-header">

            <h2>
                جزئیات انتقال
            </h2>

            <button
                class="close-btn"
                onclick="closeTransferModal()"
            >
                ×
            </button>

        </div>

        <div id="modalContent">

            <div class="modal-loading">
                در حال دریافت جزئیات انتقال...
            </div>

        </div>

    </div>

</div>


<script>

const API_URL = "https://kifyar-api.onrender.com";

const TOKEN_KEY = "kifyar_token";

let token = localStorage.getItem(TOKEN_KEY);

let previousTransfers = {};

let firstTransferLoad = true;

let notificationTimer = null;


if (!token) {
    window.location.href = "login.html";
}


/* -----------------------------
   Helpers
----------------------------- */

function authHeaders() {

    return {
        "Authorization": "Bearer " + token,
        "Content-Type": "application/json"
    };

}


function formatAmount(amount) {

    return Number(amount || 0).toLocaleString("fa-IR");

}


function formatDate(value) {

    if (!value) {
        return "-";
    }

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
        return value;
    }

    return date.toLocaleString("fa-IR", {
        dateStyle: "medium",
        timeStyle: "short"
    });

}


function statusText(status) {

    switch (status) {

        case "pending":
            return "در انتظار پردازش";

        case "completed":
            return "تکمیل شده";

        case "failed":
            return "ناموفق";

        case "cancelled":
            return "لغو شده";

        default:
            return status || "نامشخص";
    }

}


function statusClass(status) {

    switch (status) {

        case "completed":
            return "status-completed";

        case "failed":
            return "status-failed";

        case "cancelled":
            return "status-cancelled";

        default:
            return "status-pending";
    }

}


function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* -----------------------------
   Notification
----------------------------- */

function showNotification(
    status,
    title,
    text
) {

    const area =
        document.getElementById("notificationArea");

    const notification =
        document.getElementById("notification");

    document.getElementById(
        "notificationTitle"
    ).textContent = title;

    document.getElementById(
        "notificationText"
    ).textContent = text;

    notification.className =
        "notification " + status + " show";

    area.style.display = "block";

    if (notificationTimer) {
        clearTimeout(notificationTimer);
    }

    notificationTimer = setTimeout(() => {
        hideNotification();
    }, 10000);

}


function hideNotification() {

    const area =
        document.getElementById("notificationArea");

    area.style.display = "none";

}


/* -----------------------------
   Status Change Notification
----------------------------- */

function checkStatusChanges(transfers) {

    if (firstTransferLoad) {

        previousTransfers = {};

        transfers.forEach(transfer => {

            previousTransfers[
                String(transfer.id)
            ] = transfer.status;

        });

        firstTransferLoad = false;

        return;
    }


    transfers.forEach(transfer => {

        const id = String(transfer.id);

        const oldStatus =
            previousTransfers[id];

        const newStatus =
            transfer.status;


        if (
            oldStatus &&
            newStatus &&
            oldStatus !== newStatus
        ) {

            const amount =
                formatAmount(transfer.amount);

            if (newStatus === "completed") {

                showNotification(
                    "completed",
                    "انتقال تکمیل شد ✅",
                    `انتقال ${amount} تومان با موفقیت تکمیل شد.`
                );

            } else if (newStatus === "failed") {

                showNotification(
                    "failed",
                    "انتقال ناموفق شد",
                    `انتقال ${amount} تومان ناموفق شد و مبلغ طبق سیستم بازگردانده شده است.`
                );

            } else if (newStatus === "cancelled") {

                showNotification(
                    "cancelled",
                    "انتقال لغو شد",
                    `انتقال ${amount} تومان لغو شد و مبلغ طبق سیستم بازگردانده شده است.`
                );

            } else if (newStatus === "pending") {

                showNotification(
                    "pending",
                    "وضعیت انتقال تغییر کرد",
                    `انتقال ${amount} تومان اکنون در انتظار پردازش است.`
                );
            }

        }


        previousTransfers[id] = newStatus;

    });

}


/* -----------------------------
   Balance
----------------------------- */

async function loadBalance() {

    const balanceElement =
        document.getElementById("balance");

    try {

        const response = await fetch(
            API_URL + "/api/wallet/balance",
            {
                headers: authHeaders()
            }
        );

        if (response.status === 401) {

            localStorage.removeItem(TOKEN_KEY);

            window.location.href =
                "login.html";

            return;
        }

        if (!response.ok) {
            throw new Error();
        }

        const data =
            await response.json();

        const balance =
            data.balance ??
            data.amount ??
            0;

        balanceElement.textContent =
            formatAmount(balance);

    } catch (error) {

        console.error(error);

        balanceElement.textContent =
            "خطا";
    }

}


/* -----------------------------
   Transfers
----------------------------- */

async function loadTransfers() {

    const list =
        document.getElementById("transferList");

    try {

        const response = await fetch(
            API_URL + "/api/wallet/card-transfers",
            {
                headers: authHeaders()
            }
        );

        if (response.status === 401) {

            localStorage.removeItem(TOKEN_KEY);

            window.location.href =
                "login.html";

            return;
        }

        if (!response.ok) {
            throw new Error();
        }

        const data =
            await response.json();

        let transfers = [];

        if (Array.isArray(data)) {

            transfers = data;

        } else if (Array.isArray(data.transfers)) {

            transfers = data.transfers;

        } else if (Array.isArray(data.items)) {

            transfers = data.items;

        }


        checkStatusChanges(transfers);


        if (transfers.length === 0) {

            list.innerHTML = `
                <div class="empty">
                    هنوز درخواست انتقالی ثبت نشده است.
                </div>
            `;

            return;
        }


        list.innerHTML = "";


        transfers.forEach(transfer => {

            const card =
                document.createElement("div");

            card.className = "transfer";

            card.onclick = () => {
                openTransferDetails(transfer.id);
            };


            const status =
                transfer.status || "pending";

            const amount =
                formatAmount(transfer.amount);

            const cardNumber =
                transfer.card_number ||
                transfer.card ||
                "نامشخص";

            const requestId =
                transfer.request_id || "-";


            let refund = "";

            if (
                status === "failed" ||
                status === "cancelled"
            ) {

                refund = `
                    <div class="refund-note">
                        مبلغ این انتقال طبق وضعیت سیستم
                        به موجودی کیف پول بازگردانده شده است.
                    </div>
                `;
            }


            card.innerHTML = `

                <div class="transfer-header">

                    <div class="transfer-title">
                        انتقال به کارت
                    </div>

                    <div class="transfer-amount">
                        ${amount} تومان
                    </div>

                </div>

                <div class="transfer-info">

                    <div>
                        کارت:
                        ${escapeHtml(cardNumber)}
                    </div>

                    <div>
                        وضعیت:

                        <span class="status ${statusClass(status)}">
                            ${statusText(status)}
                        </span>
                    </div>

                    <div>
                        شناسه انتقال:
                        ${escapeHtml(String(transfer.id ?? "-"))}
                    </div>

                    <div>
                        تاریخ:
                        ${formatDate(transfer.created_at)}
                    </div>

                </div>

                ${refund}

                <div class="click-hint">
                    برای مشاهده جزئیات کامل کلیک کنید
                </div>
            `;


            const oldStatus =
                previousTransfers[
                    String(transfer.id)
                ];


            if (
                oldStatus &&
                oldStatus !== status
            ) {

                card.classList.add("changed");

            }


            list.appendChild(card);

        });


    } catch (error) {

        console.error(error);

        list.innerHTML = `
            <div class="error">
                دریافت درخواست‌های انتقال ناموفق بود.
                <br>
                لطفاً دوباره بروزرسانی کنید.
            </div>
        `;
    }

}


/* -----------------------------
   Transfer Details
----------------------------- */

async function openTransferDetails(transferId) {

    const overlay =
        document.getElementById("modalOverlay");

    const content =
        document.getElementById("modalContent");

    overlay.classList.add("show");

    content.innerHTML = `
        <div class="modal-loading">
            در حال دریافت جزئیات انتقال...
        </div>
    `;


    try {

        const response = await fetch(
            API_URL +
            "/api/wallet/card-transfers/" +
            encodeURIComponent(transferId),
            {
                headers: authHeaders()
            }
        );


        if (response.status === 401) {

            localStorage.removeItem(TOKEN_KEY);

            window.location.href =
                "login.html";

            return;
        }


        if (!response.ok) {

            throw new Error(
                "دریافت جزئیات انتقال ناموفق بود."
            );
        }


        const transfer =
            await response.json();

        renderTransferDetails(transfer);

    } catch (error) {

        content.innerHTML = `
            <div class="modal-error">
                ${escapeHtml(error.message)}
            </div>
        `;
    }

}


/* -----------------------------
   Render Details
----------------------------- */

function renderTransferDetails(transfer) {

    const content =
        document.getElementById("modalContent");

    const status =
        transfer.status || "pending";

    const cardNumber =
        transfer.card_number ||
        transfer.card ||
        "نامشخص";


    let refundNote = "";

    if (
        status === "failed" ||
        status === "cancelled"
    ) {

        refundNote = `
            <div class="refund-note">
                این انتقال نهایی نشده و مبلغ آن
                طبق وضعیت سیستم بازگردانده شده است.
            </div>
        `;
    }


    content.innerHTML = `

        <div class="detail-list">

            <div class="detail-row">

                <div class="detail-label">
                    وضعیت
                </div>

                <div class="detail-value">

                    <span class="status ${statusClass(status)}">
                        ${statusText(status)}
                    </span>

                </div>

            </div>

            <div class="detail-row">

                <div class="detail-label">
                    مبلغ انتقال
                </div>

                <div class="detail-value">
                    ${formatAmount(transfer.amount)} تومان
                </div>

            </div>

            <div class="detail-row">

                <div class="detail-label">
                    کارت مقصد
                </div>

                <div class="detail-value">
                    ${escapeHtml(cardNumber)}
                </div>

            </div>

            <div class="detail-row">

                <div class="detail-label">
                    شناسه انتقال
                </div>

                <div class="detail-value">
                    ${escapeHtml(String(transfer.id ?? "-"))}
                </div>

            </div>

            <div class="detail-row">

                <div class="detail-label">
                    شناسه درخواست
                </div>

                <div class="detail-value">
                    ${escapeHtml(String(transfer.request_id ?? "-"))}
                </div>

            </div>

            <div class="detail-row">

                <div class="detail-label">
                    زمان ثبت
                </div>

                <div class="detail-value">
                    ${formatDate(transfer.created_at)}
                </div>

            </div>

            <div class="detail-row">

                <div class="detail-label">
                    آخرین بروزرسانی
                </div>

                <div class="detail-value">
                    ${formatDate(transfer.updated_at)}
                </div>

            </div>

        </div>

        ${refundNote}
    `;

}


/* -----------------------------
   Close Modal
----------------------------- */

function closeTransferModal() {

    document
        .getElementById("modalOverlay")
        .classList.remove("show");

}


document
    .getElementById("modalOverlay")
    .addEventListener("click", function(event) {

        if (event.target === this) {
            closeTransferModal();
        }

    });


document.addEventListener("keydown", function(event) {

    if (event.key === "Escape") {
        closeTransferModal();
    }

});


/* -----------------------------
   Refresh
----------------------------- */

async function refreshWallet() {

    await Promise.all([
        loadBalance(),
        loadTransfers()
    ]);

}


/* -----------------------------
   Profile
----------------------------- */

function goProfile() {

    window.location.href =
        "profile.html";

}


/* -----------------------------
   Start
----------------------------- */

refreshWallet();


/*
   هر ۱۵ ثانیه:
   - موجودی بررسی می‌شود
   - وضعیت انتقال‌ها بررسی می‌شود
   - اگر وضعیت عوض شده باشد، اعلان نمایش داده می‌شود
*/

setInterval(() => {

    loadBalance();
    loadTransfers();

}, 15000);

</script>

</body>
</html>
