<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>کیف پول - کیف‌یار</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
        }

        .page-header h1 {
            margin: 0;
        }

        .page-header a {
            text-decoration: none;
            color: #2563eb;
            font-weight: bold;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.05);
        }

        .card h2 {
            margin-top: 0;
        }

        .card p {
            color: #666;
            line-height: 1.8;
        }

        .balance {
            font-size: 32px;
            font-weight: bold;
            color: #2563eb;
            margin-top: 15px;
        }

        .balance-label {
            color: #777;
            margin-top: 5px;
        }

        label {
            display: block;
            margin:
                14px 0 7px;
            font-weight: bold;
        }

        select,
        input {
            width: 100%;
            height: 48px;
            border:
                1px solid
                #d1d5db;
            border-radius: 12px;
            padding:
                0 12px;
            font-family: inherit;
            font-size: 14px;
            background: white;
        }

        select:focus,
        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow:
                0 0 0 3px
                rgba(
                    37,
                    99,
                    235,
                    0.1
                );
        }

        .wallet-button {
            width: 100%;
            margin-top: 18px;
            height: 50px;
            border: none;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-family: inherit;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }

        .wallet-button:hover {
            background: #1d4ed8;
        }

        .wallet-button:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        .message {
            display: none;
            margin-top: 14px;
            padding: 12px;
            border-radius: 10px;
            line-height: 1.7;
        }

        .message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .transaction-item {
            border:
                1px solid
                #e5e7eb;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            line-height: 1.9;
            background: #fafafa;
        }

        .transaction-item:last-child {
            margin-bottom: 0;
        }

        .status-pending {
            color: #b45309;
        }

        .status-completed {
            color: #15803d;
        }

        .status-failed,
        .status-cancelled {
            color: #b91c1c;
        }

        .loading {
            color: #777;
            padding: 15px 0;
        }

    </style>

</head>

<body>

<div class="container">

    <header class="page-header">

        <h1>
            💰 کیف پول
        </h1>

        <a href="index.html">
            بازگشت
        </a>

    </header>


    <!-- =====================================================
         BALANCE
         ===================================================== -->

    <section class="card">

        <h2>
            موجودی فعلی
        </h2>

        <div
            id="balance"
            class="balance"
        >
            در حال دریافت...
        </div>

        <div class="balance-label">
            تومان
        </div>

    </section>


    <!-- =====================================================
         TRANSFER TO CARD
         ===================================================== -->

    <section class="card">

        <h2>
            💳 انتقال به کارت بانکی
        </h2>

        <p>
            مبلغ موردنظر را از موجودی کیف پول به یکی از کارت‌های ثبت‌شده منتقل کنید.
        </p>


        <label for="transferCard">
            کارت مقصد
        </label>

        <select
            id="transferCard"
        >

            <option value="">
                در حال دریافت کارت‌ها...
            </option>

        </select>


        <label for="transferAmount">
            مبلغ انتقال
        </label>

        <input
            id="transferAmount"
            type="number"
            min="1"
            step="1000"
            placeholder="مثلاً 50000"
        >


        <button
            id="transferButton"
            class="wallet-button"
            type="button"
        >
            انتقال به کارت
        </button>


        <div
            id="transferMessage"
            class="message"
        ></div>

    </section>


    <!-- =====================================================
         TRANSFER LIST
         ===================================================== -->

    <section class="card">

        <h2>
            📋 آخرین درخواست‌های انتقال
        </h2>

        <div id="transferList">
            <div class="loading">
                در حال دریافت...
            </div>
        </div>

    </section>


    <!-- =====================================================
         DEPOSIT
         ===================================================== -->

    <section class="card">

        <h2>
            ➕ افزایش موجودی
        </h2>

        <p>
            برای افزایش موجودی از کارت بانکی ثبت‌شده استفاده کنید.
        </p>


        <label for="depositCard">
            کارت بانکی
        </label>

        <select
            id="depositCard"
        >

            <option value="">
                در حال دریافت کارت‌ها...
            </option>

        </select>


        <label for="depositAmount">
            مبلغ
        </label>

        <input
            id="depositAmount"
            type="number"
            min="1"
            step="1000"
            placeholder="مثلاً 50000"
        >


        <button
            id="depositButton"
            class="wallet-button"
            type="button"
        >
            افزایش موجودی
        </button>


        <div
            id="depositMessage"
            class="message"
        ></div>

    </section>

</div>


<script>

// =========================================================
// API
// =========================================================

const API_URL =
    "https://kifyar-api.onrender.com";


// =========================================================
// AUTH STORAGE
// =========================================================

const TOKEN_KEY =
    "kifyar_token";


// =========================================================
// TOKEN
// =========================================================

function getToken() {

    return localStorage.getItem(
        TOKEN_KEY
    ) || "";

}


// =========================================================
// AUTH HEADERS
// =========================================================

function authHeaders() {

    const token =
        getToken();

    return {
        "Content-Type":
            "application/json",

        "Accept":
            "application/json",

        "Authorization":
            "Bearer " + token
    };

}


// =========================================================
// AUTH CHECK
// =========================================================

function ensureLoggedIn() {

    const token =
        getToken();

    if (!token) {

        window.location.href =
            "login.html";

        return false;
    }

    return true;
}


// =========================================================
// API REQUEST
// =========================================================

async function apiRequest(
    endpoint,
    options = {}
) {

    const response =
        await fetch(
            API_URL + endpoint,
            {
                ...options,

                headers: {
                    ...authHeaders(),
                    ...(options.headers || {})
                }
            }
        );


    if (
        response.status === 401
    ) {

        localStorage.removeItem(
            TOKEN_KEY
        );

        localStorage.removeItem(
            "kifyar_user"
        );

        window.location.href =
            "login.html";

        throw new Error(
            "جلسه ورود معتبر نیست."
        );

    }


    return response;

}


// =========================================================
// MONEY
// =========================================================

function formatMoney(
    value
) {

    return Number(
        value || 0
    ).toLocaleString(
        "fa-IR"
    );

}


// =========================================================
// MESSAGE
// =========================================================

function showMessage(
    element,
    message,
    success = false
) {

    element.textContent =
        message;

    element.className =
        success
            ? "message success"
            : "message error";

}


// =========================================================
// LOAD BALANCE
// =========================================================

async function loadBalance() {

    const balanceElement =
        document.getElementById(
            "balance"
        );


    try {

        const response =
            await apiRequest(
                "/api/wallet/balance"
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "دریافت موجودی انجام نشد."
            );

        }


        balanceElement.textContent =
            formatMoney(
                data.balance
            );


    } catch (
        error
    ) {

        console.error(
            "Balance error:",
            error
        );


        balanceElement.textContent =
            "خطا";

    }

}


// =========================================================
// LOAD CARDS
// =========================================================

async function loadCards() {

    const transferCard =
        document.getElementById(
            "transferCard"
        );


    const depositCard =
        document.getElementById(
            "depositCard"
        );


    try {

        const response =
            await apiRequest(
                "/api/cards"
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "دریافت کارت‌ها انجام نشد."
            );

        }


        transferCard.innerHTML =
            "";

        depositCard.innerHTML =
            "";


        if (
            !data.cards ||
            data.cards.length === 0
        ) {

            transferCard.innerHTML = `
                <option value="">
                    هنوز کارتی ثبت نشده است
                </option>
            `;


            depositCard.innerHTML = `
                <option value="">
                    هنوز کارتی ثبت نشده است
                </option>
            `;


            return;

        }


        data.cards.forEach(
            card => {

                const text =
                    `${
                        card.bank_name ||
                        "بانک"
                    } - ${
                        card.masked_card_number ||
                        "کارت"
                    }`;


                const option1 =
                    document.createElement(
                        "option"
                    );


                option1.value =
                    card.id;


                option1.textContent =
                    text;


                transferCard.appendChild(
                    option1
                );


                const option2 =
                    document.createElement(
                        "option"
                    );


                option2.value =
                    card.id;


                option2.textContent =
                    text;


                depositCard.appendChild(
                    option2
                );

            }
        );


    } catch (
        error
    ) {

        console.error(
            "Cards error:",
            error
        );


        transferCard.innerHTML = `
            <option value="">
                خطا در دریافت کارت‌ها
            </option>
        `;


        depositCard.innerHTML = `
            <option value="">
                خطا در دریافت کارت‌ها
            </option>
        `;

    }

}


// =========================================================
// TRANSFER TO CARD
// =========================================================

async function transferToCard() {

    const cardId =
        Number(
            document.getElementById(
                "transferCard"
            ).value
        );


    const amount =
        Number(
            document.getElementById(
                "transferAmount"
            ).value
        );


    const message =
        document.getElementById(
            "transferMessage"
        );


    const button =
        document.getElementById(
            "transferButton"
        );


    if (!cardId) {

        showMessage(
            message,
            "ابتدا کارت مقصد را انتخاب کنید."
        );

        return;

    }


    if (
        !Number.isFinite(amount) ||
        amount <= 0
    ) {

        showMessage(
            message,
            "مبلغ انتقال را صحیح وارد کنید."
        );

        return;

    }


    if (
        amount > 100000000
    ) {

        showMessage(
            message,
            "مبلغ انتقال بیش از حد مجاز است."
        );

        return;

    }


    button.disabled =
        true;


    button.textContent =
        "در حال ثبت...";


    try {

        const requestId =
            "transfer-" +
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .slice(2);


        const response =
            await apiRequest(
                "/api/wallet/transfer-to-card",
                {
                    method:
                        "POST",

                    body:
                        JSON.stringify(
                            {
                                card_id:
                                    cardId,

                                amount:
                                    amount,

                                request_id:
                                    requestId
                            }
                        )
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "ثبت انتقال انجام نشد."
            );

        }


        showMessage(
            message,

            `درخواست انتقال ${
                formatMoney(amount)
            } تومان ثبت شد. وضعیت: ${
                data.status ||
                data.transfer?.status ||
                "pending"
            }`,

            true
        );


        document.getElementById(
            "transferAmount"
        ).value =
            "";


        await loadBalance();

        await loadTransfers();


    } catch (
        error
    ) {

        console.error(
            "Transfer error:",
            error
        );


        showMessage(
            message,
            error.message ||
            "خطایی رخ داد."
        );

    } finally {

        button.disabled =
            false;

        button.textContent =
            "انتقال به کارت";

    }

}


// =========================================================
// LOAD TRANSFERS
// =========================================================

async function loadTransfers() {

    const list =
        document.getElementById(
            "transferList"
        );


    try {

        const response =
            await apiRequest(
                "/api/wallet/card-transfers"
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "دریافت انتقال‌ها انجام نشد."
            );

        }


        if (
            !data.transfers ||
            data.transfers.length === 0
        ) {

            list.innerHTML =
                "<p>هنوز انتقالی ثبت نشده است.</p>";

            return;

        }


        list.innerHTML =
            "";


        data.transfers.forEach(
            transfer => {

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "transaction-item";


                const status =
                    transfer.status ||
                    "pending";


                let statusText =
                    "در انتظار پردازش";


                let statusClass =
                    "status-pending";


                if (
                    status ===
                    "completed"
                ) {

                    statusText =
                        "تکمیل شده";

                    statusClass =
                        "status-completed";

                }

                else if (
                    status ===
                    "failed"
                ) {

                    statusText =
                        "ناموفق";

                    statusClass =
                        "status-failed";

                }

                else if (
                    status ===
                    "cancelled"
                ) {

                    statusText =
                        "لغو شده";

                    statusClass =
                        "status-cancelled";

                }


                item.innerHTML = `

                    <strong>
                        انتقال به کارت
                    </strong>

                    <div>
                        مبلغ:
                        ${
                            formatMoney(
                                transfer.amount
                            )
                        }
                        تومان
                    </div>

                    <div>
                        کارت:
                        ${
                            transfer.masked_card_number ||
                            "-"
                        }
                    </div>

                    <div>
                        وضعیت:
                        <span class="${statusClass}">
                            ${statusText}
                        </span>
                    </div>

                    <small>
                        ${
                            transfer.created_at ||
                            ""
                        }
                    </small>

                `;


                list.appendChild(
                    item
                );

            }
        );


    } catch (
        error
    ) {

        console.error(
            "Transfer list error:",
            error
        );


        list.innerHTML =
            "<p>خطا در دریافت درخواست‌ها.</p>";

    }

}


// =========================================================
// DEPOSIT
// =========================================================

async function depositByCard() {

    const cardId =
        Number(
            document.getElementById(
                "depositCard"
            ).value
        );


    const amount =
        Number(
            document.getElementById(
                "depositAmount"
            ).value
        );


    const message =
        document.getElementById(
            "depositMessage"
        );


    const button =
        document.getElementById(
            "depositButton"
        );


    if (!cardId) {

        showMessage(
            message,
            "ابتدا کارت را انتخاب کنید."
        );

        return;

    }


    if (
        !Number.isFinite(amount) ||
        amount <= 0
    ) {

        showMessage(
            message,
            "مبلغ را صحیح وارد کنید."
        );

        return;

    }


    if (
        amount > 100000000
    ) {

        showMessage(
            message,
            "مبلغ بیشتر از حد مجاز است."
        );

        return;

    }


    button.disabled =
        true;


    button.textContent =
        "در حال ثبت...";


    try {

        const requestId =
            "deposit-" +
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .slice(2);


        const response =
            await apiRequest(
                "/api/wallet/deposit",
                {
                    method:
                        "POST",

                    body:
                        JSON.stringify(
                            {
                                card_id:
                                    cardId,

                                amount:
                                    amount,

                                request_id:
                                    requestId
                            }
                        )
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "افزایش موجودی انجام نشد."
            );

        }


        showMessage(
            message,

            `مبلغ ${
                formatMoney(amount)
            } تومان به کیف پول اضافه شد.`,

            true
        );


        document.getElementById(
            "depositAmount"
        ).value =
            "";


        await loadBalance();


    } catch (
        error
    ) {

        console.error(
            "Deposit error:",
            error
        );


        showMessage(
            message,
            error.message ||
            "خطایی رخ داد."
        );

    } finally {

        button.disabled =
            false;

        button.textContent =
            "افزایش موجودی";

    }

}


// =========================================================
// EVENTS
// =========================================================

document
    .getElementById(
        "transferButton"
    )
    .addEventListener(
        "click",
        transferToCard
    );


document
    .getElementById(
        "depositButton"
    )
    .addEventListener(
        "click",
        depositByCard
    );


// =========================================================
// INITIALIZE
// =========================================================

async function init() {

    if (
        !ensureLoggedIn()
    ) {

        return;

    }


    await Promise.all([
        loadBalance(),
        loadCards(),
        loadTransfers()
    ]);

}


init();

</script>

</body>

</html>
