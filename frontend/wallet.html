<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>کیف پول | KifYar</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #f4f6f9;
            color: #172033;
            font-family: Tahoma, Arial, sans-serif;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
        }

        h1,
        h2 {
            margin-top: 0;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .topbar-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 11px 15px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-gray {
            background: #e5e7eb;
            color: #111827;
        }

        .balance {
            text-align: center;
            padding: 25px 10px;
        }

        .balance-title {
            color: #667085;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .balance-value {
            font-size: 34px;
            font-weight: bold;
        }

        .balance-unit {
            font-size: 15px;
            color: #667085;
        }

        .message {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .message.error {
            background: #fee2e2;
            color: #991b1b;
        }

        .message.success {
            background: #dcfce7;
            color: #166534;
        }

        .hidden {
            display: none !important;
        }

        .loading {
            text-align: center;
            color: #667085;
            padding: 25px;
        }

        .transfer {
            border: 1px solid #eaecf0;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
            background: #fff;
        }

        .transfer:last-child {
            margin-bottom: 0;
        }

        .transfer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .transfer-title {
            font-weight: bold;
        }

        .transfer-amount {
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .transfer-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 7px 0;
            color: #667085;
            font-size: 13px;
        }

        .transfer-row strong {
            color: #172033;
            text-align: left;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        .status-pending {
            background: #fef3c7;
            color: #92400e;
        }

        .status-completed {
            background: #dcfce7;
            color: #166534;
        }

        .status-failed {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-cancelled {
            background: #e5e7eb;
            color: #374151;
        }

        .refund-note {
            margin-top: 12px;
            padding: 10px;
            background: #ecfdf3;
            color: #166534;
            border-radius: 10px;
            font-size: 13px;
        }

        .empty {
            text-align: center;
            padding: 35px;
            color: #667085;
        }

        .simulation {
            display: inline-block;
            background: #ede9fe;
            color: #5b21b6;
            padding: 5px 9px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .topbar {
                align-items: stretch;
                flex-direction: column;
            }

            .topbar-actions button {
                flex: 1;
            }

            .balance-value {
                font-size: 28px;
            }

            .transfer-row {
                flex-direction: column;
                gap: 3px;
            }

            .transfer-row strong {
                text-align: right;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="topbar">

        <div>
            <h1>کیف پول</h1>

            <span class="simulation">
                حالت شبیه‌سازی
            </span>
        </div>

        <div class="topbar-actions">

            <button
                class="btn-primary"
                onclick="loadAll()"
            >
                🔄 بروزرسانی
            </button>

            <button
                class="btn-gray"
                onclick="goProfile()"
            >
                پروفایل
            </button>

        </div>

    </div>


    <div id="message"></div>


    <!-- موجودی -->

    <div class="card balance">

        <div class="balance-title">
            موجودی فعلی
        </div>

        <div class="balance-value">
            <span id="balance">
                ۰
            </span>

            <span class="balance-unit">
                تومان
            </span>
        </div>

    </div>


    <!-- انتقال‌ها -->

    <div class="card">

        <div class="transfer-header">

            <h2>
                📋 آخرین درخواست‌های انتقال
            </h2>

        </div>


        <div
            id="loading"
            class="loading"
        >
            در حال دریافت اطلاعات...
        </div>


        <div
            id="transfers"
            class="hidden"
        ></div>

    </div>

</div>


<script>

const API_URL =
    "https://kifyar-api.onrender.com";

const TOKEN_KEY =
    "kifyar_token";


/* =========================================================
   HELPERS
========================================================= */

function getToken() {

    return localStorage.getItem(
        TOKEN_KEY
    );
}


function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function formatNumber(value) {

    return Number(value || 0)
        .toLocaleString("fa-IR");
}


function formatAmount(value) {

    return (
        formatNumber(value) +
        " تومان"
    );
}


function formatDate(value) {

    if (!value) {
        return "-";
    }

    const date =
        new Date(value);

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return escapeHtml(value);
    }

    return date.toLocaleString(
        "fa-IR"
    );
}


function statusText(status) {

    const statuses = {

        pending:
            "در انتظار پردازش",

        completed:
            "تکمیل‌شده",

        failed:
            "ردشده",

        cancelled:
            "لغوشده"

    };

    return (
        statuses[status] ||
        status ||
        "-"
    );
}


function showMessage(
    text,
    type = "error"
) {

    const element =
        document.getElementById(
            "message"
        );

    if (!text) {

        element.innerHTML = "";

        return;
    }

    element.innerHTML = `
        <div class="message ${type}">
            ${escapeHtml(text)}
        </div>
    `;

    setTimeout(() => {

        element.innerHTML = "";

    }, 5000);
}


/* =========================================================
   API
========================================================= */

async function apiFetch(
    path,
    options = {}
) {

    const token =
        getToken();

    if (!token) {

        throw new Error(
            "لطفاً ابتدا وارد حساب خود شوید."
        );
    }

    const headers = {
        ...(options.headers || {}),
        "Authorization":
            "Bearer " + token
    };

    const response =
        await fetch(
            API_URL + path,
            {
                ...options,
                headers
            }
        );

    let data = null;

    try {

        data =
            await response.json();

    } catch {

        data = null;
    }


    if (!response.ok) {

        let message =
            "خطا در ارتباط با سرور.";

        if (data?.detail) {

            message =
                typeof data.detail === "string"
                    ? data.detail
                    : JSON.stringify(
                        data.detail
                    );
        }

        if (
            response.status === 401
        ) {

            localStorage.removeItem(
                TOKEN_KEY
            );

            setTimeout(() => {

                window.location.href =
                    "login.html";

            }, 500);

        }

        throw new Error(
            message
        );
    }

    return data;
}


/* =========================================================
   BALANCE
========================================================= */

async function loadBalance() {

    const data =
        await apiFetch(
            "/api/wallet/balance"
        );

    let balance = 0;

    if (
        typeof data === "number"
    ) {

        balance = data;

    } else if (
        data &&
        typeof data.balance !==
        "undefined"
    ) {

        balance =
            Number(
                data.balance
            );

    } else if (
        data &&
        typeof data.amount !==
        "undefined"
    ) {

        balance =
            Number(
                data.amount
            );
    }

    document.getElementById(
        "balance"
    ).textContent =
        formatNumber(
            balance
        );
}


/* =========================================================
   TRANSFERS
========================================================= */

async function loadTransfers() {

    const data =
        await apiFetch(
            "/api/wallet/card-transfers"
        );

    let items = [];

    if (
        Array.isArray(data)
    ) {

        items = data;

    } else if (
        Array.isArray(
            data?.items
        )
    ) {

        items =
            data.items;

    } else if (
        Array.isArray(
            data?.transfers
        )
    ) {

        items =
            data.transfers;
    }

    renderTransfers(
        items
    );
}


function renderTransfers(
    items
) {

    const container =
        document.getElementById(
            "transfers"
        );

    if (!items.length) {

        container.innerHTML = `
            <div class="empty">
                هنوز درخواست انتقالی ثبت نکرده‌اید.
            </div>
        `;

        container.classList.remove(
            "hidden"
        );

        return;
    }


    container.innerHTML =
        items
            .map(
                transfer => {

                    const status =
                        transfer.status ||
                        "pending";

                    const card =
                        transfer.masked_card_number ||
                        transfer.card_number_masked ||
                        transfer.card_number ||
                        "----";

                    const transferId =
                        transfer.id ??
                        transfer.transfer_id ??
                        "-";

                    const requestId =
                        transfer.request_id ||
                        "-";

                    const createdAt =
                        transfer.created_at ||
                        transfer.updated_at ||
                        null;


                    let refundNote = "";

                    if (
                        status === "failed" ||
                        status === "cancelled"
                    ) {

                        refundNote = `
                            <div class="refund-note">
                                💰 مبلغ این انتقال طبق منطق کیف‌یار
                                به موجودی حساب برگردانده شده است.
                            </div>
                        `;
                    }


                    return `
                        <div class="transfer">

                            <div class="transfer-header">

                                <div class="transfer-title">
                                    📋 انتقال به کارت
                                </div>

                                <span
                                    class="status status-${escapeHtml(status)}"
                                >
                                    ${escapeHtml(
                                        statusText(
                                            status
                                        )
                                    )}
                                </span>

                            </div>


                            <div class="transfer-amount">
                                ${formatAmount(
                                    transfer.amount
                                )}
                            </div>


                            <div class="transfer-row">

                                <span>
                                    کارت:
                                </span>

                                <strong>
                                    ${escapeHtml(card)}
                                </strong>

                            </div>


                            <div class="transfer-row">

                                <span>
                                    شناسه انتقال:
                                </span>

                                <strong>
                                    #${escapeHtml(
                                        transferId
                                    )}
                                </strong>

                            </div>


                            <div class="transfer-row">

                                <span>
                                    Request ID:
                                </span>

                                <strong
                                    style="
                                        direction:ltr;
                                        word-break:break-all;
                                    "
                                >
                                    ${escapeHtml(
                                        requestId
                                    )}
                                </strong>

                            </div>


                            <div class="transfer-row">

                                <span>
                                    تاریخ:
                                </span>

                                <strong>
                                    ${formatDate(
                                        createdAt
                                    )}
                                </strong>

                            </div>


                            ${refundNote}

                        </div>
                    `;
                }
            )
            .join("");

    container.classList.remove(
        "hidden"
    );
}


/* =========================================================
   LOAD ALL
========================================================= */

async function loadAll() {

    const loading =
        document.getElementById(
            "loading"
        );

    loading.classList.remove(
        "hidden"
    );


    try {

        await loadBalance();

        await loadTransfers();

    } catch (error) {

        showMessage(
            error.message ||
            "دریافت اطلاعات ناموفق بود."
        );

    } finally {

        loading.classList.add(
            "hidden"
        );
    }
}


/* =========================================================
   NAVIGATION
========================================================= */

function goProfile() {

    window.location.href =
        "profile.html";
}


/* =========================================================
   START
========================================================= */

if (!getToken()) {

    window.location.href =
        "login.html";

} else {

    loadAll();

    /*
       هر ۱۵ ثانیه اطلاعات
       موجودی و انتقال‌ها
       دوباره از سرور خوانده می‌شود.
    */

    setInterval(
        () => {

            loadAll();

        },
        15000
    );
}

</script>

</body>
</html>
