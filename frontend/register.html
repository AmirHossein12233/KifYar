<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ثبت‌نام | KifYar</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

                linear-gradient(

            width: min(

        .card {

                0 20px 60px

                    15,

        h1 {
            margin: 0;

            margin: 10px 0 25px;

            margin-bottom: 16px;
        }

            display: block;

</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">
            K
        </div>

        <h1>
            ساخت حساب KifYar
        </h1>

        <div class="subtitle">
            اطلاعات خود را وارد کنید تا حساب کیف‌یار ساخته شود.
        </div>

        <form id="registerForm">

            <div class="field">

                <label for="username">
                    نام کاربری
                </label>

                <input
                    id="username"
                    name="username"
                    type="text"
                    placeholder="مثلاً amir123"
                    autocomplete="username"
                    required
                >

            </div>

            <div class="field">

                <label for="email">
                    ایمیل
                </label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    placeholder="example@email.com"
                    autocomplete="email"
                    required
                >

            </div>

            <div class="field">

                <label for="password">
                    رمز عبور
                </label>

                <div class="password-row">

                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="حداقل ۶ کاراکتر"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="toggle"
                        id="togglePassword"
                        aria-label="نمایش رمز"
                    >
                        👁
                    </button>

                </div>

                <div class="small">
                    رمز عبور باید حداقل ۶ کاراکتر داشته باشد.
                </div>

            </div>

            <button
                id="registerButton"
                class="button"
                type="submit"
            >
                ساخت حساب
            </button>

            <div
                id="message"
                class="message"
            ></div>

        </form>

        <div class="login-link">

            قبلاً حساب ساخته‌اید؟

            <a href="/login.html">
                ورود
            </a>

        </div>

    </div>

</div>


<script>
    const API_URL =
        "https://kifyar-api.onrender.com";

    const form =
        document.getElementById(
            "registerForm"
        );

    const button =
        document.getElementById(
            "registerButton"
        );

    const message =
        document.getElementById(
            "message"
        );

    const passwordInput =
        document.getElementById(
            "password"
        );

    const togglePassword =
        document.getElementById(
            "togglePassword"
        );


    function showMessage(
        text,
        type
    ) {

        message.textContent = text;

        message.className =
            "message " + type;
    }


    togglePassword.addEventListener(
        "click",
        function () {

            if (
                passwordInput.type
                === "password"
            ) {

                passwordInput.type =
                    "text";

                togglePassword.textContent =
                    "🙈";

            } else {

                passwordInput.type =
                    "password";

                togglePassword.textContent =
                    "👁";
            }

        }
    );


    form.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            const username =
                document
                    .getElementById("username")
                    .value
                    .trim();

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim()
                    .toLowerCase();

            const password =
                passwordInput.value;


            if (!username) {

                showMessage(
                    "نام کاربری را وارد کنید.",
                    "error"
                );

                return;
            }


            if (!email) {

                showMessage(
                    "ایمیل را وارد کنید.",
                    "error"
                );

                return;
            }


            if (!password) {

                showMessage(
                    "رمز عبور را وارد کنید.",
                    "error"
                );

                return;
            }


            if (password.length < 6) {

                showMessage(
                    "رمز عبور باید حداقل ۶ کاراکتر باشد.",
                    "error"
                );

                return;
            }


            button.disabled = true;

            button.textContent =
                "در حال ساخت حساب...";

            message.className =
                "message";


            try {

                const response =
                    await fetch(
                        API_URL +
                        "/api/register",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify(
                                {
                                    username:
                                        username,

                                    email:
                                        email,

                                    password:
                                        password
                                }
                            )
                        }
                    );


                let data = null;


                try {

                    data =
                        await response.json();

                } catch {

                    data = null;

                }


                if (!response.ok) {

                    let errorText =
                        "ثبت‌نام انجام نشد.";

                    if (
                        data &&
                        typeof data.detail
                        === "string"
                    ) {

                        errorText =
                            data.detail;

                    } else if (
                        data &&
                        Array.isArray(
                            data.detail
                        )
                    ) {

                        errorText =
                            data.detail
                                .map(
                                    item =>
                                        item.msg
                                        || "خطای اعتبارسنجی"
                                )
                                .join("، ");

                    }

                    throw new Error(
                        errorText
                    );
                }


                showMessage(
                    "حساب با موفقیت ساخته شد. در حال انتقال به صفحه ورود...",
                    "success"
                );


                setTimeout(
                    function () {

                        window.location.href =
                            "/login.html";

                    },
                    1200
                );


            } catch (error) {

                console.error(
                    "Register error:",
                    error
                );

                showMessage(
                    error.message
                    || "خطایی در ارتباط با سرور رخ داد.",
                    "error"
                );

            } finally {

                button.disabled = false;

                button.textContent =
                    "ساخت حساب";

            }

        }
    );
</script>

</body>
</html>
