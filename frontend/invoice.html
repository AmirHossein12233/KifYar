<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KifYar - فاکتور</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>
        .invoice-card {
            background: #ffffff;
            border-radius: 22px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
        }

        .invoice-card h2 {
            font-size: 19px;
            margin-bottom: 18px;
        }

        .invoice-field {
            margin-bottom: 14px;
        }

        .invoice-field label {
            display: block;
            margin-bottom: 7px;
            font-size: 12px;
            font-weight: bold;
        }

        .invoice-field input {
            width: 100%;
            height: 46px;
            padding: 0 12px;
            border: 1px solid #dde3ea;
            border-radius: 12px;
            outline: none;
            font-family: inherit;
            font-size: 13px;
        }

        .invoice-field input:focus {
            border-color: #1769ff;
        }

        .invoice-table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        .invoice-table th,
        .invoice-table td {
            padding: 10px 7px;
            border-bottom: 1px solid #edf0f3;
            text-align: right;
            font-size: 11px;
        }

        .invoice-table th {
            color: #66717d;
        }

        .invoice-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            padding: 15px;
            border-radius: 14px;
            background: #eef4ff;
        }

        .invoice-total strong {
            color: #1769ff;
            font-size: 17px;
        }

        .invoice-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 16px;
        }

        .invoice-btn {
            height: 46px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 13px;
            font-weight: bold;
        }

        .invoice-btn.primary {
            background: #1769ff;
            color: white;
        }

        .invoice-btn.secondary {
            background: #edf2f7;
            color: #374151;
        }

        .invoice-empty {
            text-align: center;
            color: #89939e;
            padding: 20px 0;
            font-size: 12px;
        }

        @media (max-width: 500px) {
            .invoice-buttons {
                grid-template-columns: 1fr;
            }

            .invoice-table th,
            .invoice-table td {
                font-size: 10px;
            }
        }
    </style>
</head>

<body>

<header class="topbar">

    <div class="brand">

        <div class="logo">
            ک
        </div>

        <div>
            <h1>KifYar</h1>
            <span>ساخت فاکتور</span>
        </div>

    </div>

    <button
        class="profile-btn"
        type="button"
        onclick="goProfile()"
    >
        👤
    </button>

</header>


<main>

    <section class="invoice-card">

        <h2>
            اطلاعات فاکتور
        </h2>

        <div class="invoice-field">

            <label for="customerName">
                نام مشتری
            </label>

            <input
                id="customerName"
                type="text"
                placeholder="نام مشتری"
            >

        </div>


        <div class="invoice-field">

            <label for="itemName">
                نام کالا یا خدمت
            </label>

            <input
                id="itemName"
                type="text"
                placeholder="مثلاً طراحی سایت"
            >

        </div>


        <div class="invoice-field">

            <label for="itemCount">
                تعداد
            </label>

            <input
                id="itemCount"
                type="number"
                min="1"
                value="1"
            >

        </div>


        <div class="invoice-field">

            <label for="itemPrice">
                قیمت واحد
            </label>

            <input
                id="itemPrice"
                type="number"
                min="0"
                placeholder="قیمت به تومان"
            >

        </div>


        <div class="invoice-buttons">

            <button
                class="invoice-btn primary"
                type="button"
                onclick="addItem()"
            >
                افزودن به فاکتور
            </button>

            <button
                class="invoice-btn secondary"
                type="button"
                onclick="clearInvoice()"
            >
                پاک کردن
            </button>

        </div>

    </section>


    <section class="invoice-card">

        <h2>
            اقلام فاکتور
        </h2>

        <div id="invoiceContent">

            <div class="invoice-empty">
                هنوز کالایی به فاکتور اضافه نشده است.
            </div>

        </div>


        <div class="invoice-total">

            <span>
                مبلغ کل
            </span>

            <strong id="totalPrice">
                ۰ تومان
            </strong>

        </div>


        <div class="invoice-buttons">

            <button
                class="invoice-btn primary"
                type="button"
                onclick="saveInvoice()"
            >
                ذخیره فاکتور
            </button>

            <button
                class="invoice-btn secondary"
                type="button"
                onclick="printInvoice()"
            >
                چاپ فاکتور
            </button>

        </div>

    </section>

</main>


<nav class="bottom-nav">

    <button
        type="button"
        onclick="goHome()"
    >
        🏠
        <span>
            خانه
        </span>
    </button>

    <button
        type="button"
        onclick="goPayments()"
    >
        💳
        <span>
            پرداخت
        </span>
    </button>

    <button
        class="active"
        type="button"
    >
        📄
        <span>
            فاکتور
        </span>
    </button>

    <button
        type="button"
        onclick="goProfile()"
    >
        👤
        <span>
            پروفایل
        </span>
    </button>

</nav>


<div
    id="toast"
    class="toast"
></div>


<script>

const items = [];


function getToken() {

    return localStorage.getItem(
        "kifyar_token"
    );
}


function requireLogin() {

    if (!getToken()) {

        window.location.replace(
            "login.html"
        );

        return false;
    }

    return true;
}


function formatMoney(value) {

    return Number(value).toLocaleString(
        "fa-IR"
    ) + " تومان";
}


function showToast(message) {

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    setTimeout(
        function () {

            toast.classList.remove(
                "show"
            );

        },
        2000
    );
}


function addItem() {

    const name =
        document
            .getElementById("itemName")
            .value
            .trim();

    const count =
        Number(
            document
                .getElementById("itemCount")
                .value
        );

    const price =
        Number(
            document
                .getElementById("itemPrice")
                .value
        );


    if (!name) {

        showToast(
            "نام کالا یا خدمت را وارد کنید."
        );

        return;
    }


    if (
        !Number.isFinite(count) ||
        count <= 0
    ) {

        showToast(
            "تعداد صحیح نیست."
        );

        return;
    }


    if (
        !Number.isFinite(price) ||
        price < 0
    ) {

        showToast(
            "قیمت صحیح نیست."
        );

        return;
    }


    items.push({
        name: name,
        count: count,
        price: price,
        total: count * price
    });


    document
        .getElementById("itemName")
        .value = "";

    document
        .getElementById("itemCount")
        .value = "1";

    document
        .getElementById("itemPrice")
        .value = "";


    renderInvoice();

    showToast(
        "کالا به فاکتور اضافه شد."
    );
}


function renderInvoice() {

    const container =
        document.getElementById(
            "invoiceContent"
        );


    if (items.length === 0) {

        container.innerHTML =
            '<div class="invoice-empty">' +
            'هنوز کالایی به فاکتور اضافه نشده است.' +
            '</div>';

        document.getElementById(
            "totalPrice"
        ).textContent =
            "۰ تومان";

        return;
    }


    let total = 0;

    let html =
        '<table class="invoice-table">' +
        '<thead>' +
        '<tr>' +
        '<th>عنوان</th>' +
        '<th>تعداد</th>' +
        '<th>قیمت</th>' +
        '<th>جمع</th>' +
        '</tr>' +
        '</thead>' +
        '<tbody>';


    items.forEach(
        function (item) {

            total += item.total;

            html +=
                '<tr>' +
                '<td>' +
                escapeHtml(item.name) +
                '</td>' +
                '<td>' +
                item.count +
                '</td>' +
                '<td>' +
                formatMoney(item.price) +
                '</td>' +
                '<td>' +
                formatMoney(item.total) +
                '</td>' +
                '</tr>';

        }
    );


    html +=
        '</tbody>' +
        '</table>';


    container.innerHTML =
        html;


    document.getElementById(
        "totalPrice"
    ).textContent =
        formatMoney(total);
}


function clearInvoice() {

    items.length = 0;

    document.getElementById(
        "customerName"
    ).value = "";

    document.getElementById(
        "itemName"
    ).value = "";

    document.getElementById(
        "itemCount"
    ).value = "1";

    document.getElementById(
        "itemPrice"
    ).value = "";

    renderInvoice();

    showToast(
        "فاکتور پاک شد."
    );
}


function saveInvoice() {

    if (items.length === 0) {

        showToast(
            "ابتدا یک کالا اضافه کنید."
        );

        return;
    }


    const customer =
        document
            .getElementById(
                "customerName"
            )
            .value
            .trim();


    const invoiceData = {
        customer: customer,
        items: items,
        total: items.reduce(
            function (sum, item) {
                return sum + item.total;
            },
            0
        ),
        createdAt:
            new Date().toLocaleString(
                "fa-IR"
            )
    };


    localStorage.setItem(
        "kifyar_invoice",
        JSON.stringify(
            invoiceData
        )
    );


    showToast(
        "فاکتور ذخیره شد."
    );
}


function printInvoice() {

    if (items.length === 0) {

        showToast(
            "فاکتور خالی است."
        );

        return;
    }


    window.print();
}


function escapeHtml(value) {

    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );
}


function goHome() {

    window.location.href =
        "index.html";
}


function goPayments() {

    window.location.href =
        "payments.html";
}


function goProfile() {

    window.location.href =
        "profile.html";
}


if (!requireLogin()) {

    // ورود لازم است.

}

</script>

</body>
</html>
