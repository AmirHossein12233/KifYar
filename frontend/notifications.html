<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>اعلان‌ها - کیف‌یار</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            width: min(900px, 94%);
            margin: 30px auto;
        }

        .header {
            background: white;
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,.05);
        }

        .header h1 {
            margin: 0 0 8px;
        }

        .header p {
            margin: 0;
            color: #777;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
        }

        button,
        a {
            font-family: inherit;
            border: none;
            border-radius: 10px;
            padding: 11px 15px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .secondary {
            background: #e5e7eb;
            color: #222;
        }

        .success {
            background: #16a34a;
            color: white;
        }

        .danger {
            background: #dc2626;
            color: white;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .summary-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,.05);
        }

        .summary-card span {
            display: block;
            color: #777;
            margin-bottom: 8px;
        }

        .summary-card strong {
            font-size: 25px;
        }

        .notifications {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .notification {
            background: white;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,.05);
            display: flex;
            align-items: flex-start;
            gap: 15px;
            border-right: 5px solid #2563eb;
            transition: .2s;
        }

        .notification.unread {
            box-shadow: 0 6px 22px rgba(37,99,235,.12);
        }

        .notification.warning {
            border-right-color: #f59e0b;
        }

        .notification.danger {
            border-right-color: #dc2626;
        }

        .notification.success {
            border-right-color: #16a34a;
        }

        .notification.info {
            border-right-color: #2563eb;
        }

        .notification-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #eef2ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        .notification-content {
            flex: 1;
            min-width: 0;
        }

        .notification-title {
            font-weight: bold;
            margin-bottom: 7px;
        }

        .notification-message {
            color: #666;
            line-height: 1.8;
            font-size: 14px;
            word-break: break-word;
        }

        .notification-time {
            color: #999;
            font-size: 11px;
            margin-top: 8px;
        }

        .notification-actions {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        .notification-actions button {
            padding: 8px 10px;
            font-size: 11px;
        }

        .empty {
            background: white;
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            color: #777;
            box-shadow: 0 5px 20px rgba(0,0,0,.05);
        }

        .loading {
            background: white;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            color: #777;
            box-shadow: 0 5px 20px rgba(0,0,0,.05);
        }

        .error {
            background: #fff1f2;
            border: 1px solid #fecdd3;
            color: #be123c;
            border-radius: 16px;
            padding: 18px;
            text-align: center;
            line-height: 1.8;
        }

        .refresh-info {
            margin-top: 12px;
            color: #999;
            font-size: 11px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 24px;
            height: 24px;
            padding: 0 7px;
            margin-right: 5px;
            border-radius: 999px;
            background: #dc2626;
            color: white;
            font-size: 12px;
            vertical-align: middle;
        }

        @media (max-width: 650px) {
            .summary {
                grid-template-columns: 1fr;
            }

            .notification {
                flex-direction: column;
            }

            .notification-actions {
                width: 100%;
            }

            .notification-actions button {
                flex: 1;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">

        <h1>
            🔔 اعلان‌ها
            <span
                id="headerUnreadBadge"
                class="badge"
                style="display:none;"
            >۰</span>
        </h1>

        <p>
            هشدارها و اطلاع‌رسانی‌های مالی کیف‌یار
        </p>

        <div class="actions">

            <button
                id="markAllButton"
                class="primary"
                onclick="markAllAsRead()"
            >
                خواندن همه
            </button>

            <button
                id="clearButton"
                class="danger"
                onclick="clearNotifications()"
            >
                پاک کردن اعلان‌ها
            </button>

            <button
                class="secondary"
                onclick="loadNotifications()"
            >
                🔄 بروزرسانی
            </button>

            <a
                class="secondary"
                href="index.html"
            >
                داشبورد
            </a>

            <a
                class="secondary"
                href="wallet.html"
            >
                کیف پول
            </a>

            <a
                class="secondary"
                href="transactions.html"
            >
                تراکنش‌ها
            </a>

            <a
                class="secondary"
                href="settings.html"
            >
                تنظیمات
            </a>

        </div>

        <div class="refresh-info">
            اعلان‌ها به صورت خودکار هر ۱۵ ثانیه بروزرسانی می‌شوند.
        </div>

    </div>


    <div class="summary">

        <div class="summary-card">
            <span>کل اعلان‌ها</span>
            <strong id="totalCount">۰</strong>
        </div>

        <div class="summary-card">
            <span>خوانده‌نشده</span>
            <strong id="unreadCount">۰</strong>
        </div>

    </div>


    <div
        id="notificationsContainer"
        class="notifications"
    >
        <div class="loading">
            در حال دریافت اعلان‌ها...
        </div>
    </div>

</div>


<script>

const API_URL = "https://kifyar-api.onrender.com";

const TOKEN_KEY = "kifyar_token";

const token =
    localStorage.getItem(TOKEN_KEY);


if (!token) {

    window.location.href = "login.html";

}


let notifications = [];


/* =========================
   احراز هویت
========================= */

function authHeaders() {

    return {
        "Authorization": `Bearer ${token}`,
        "Content-Type": "application/json"
    };

}


function handleUnauthorized() {

    localStorage.removeItem(TOKEN_KEY);

    window.location.href = "login.html";

}


/* =========================
   تبدیل متن
========================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =========================
   تاریخ
========================= */

function formatDate(value) {

    if (!value) {
        return "";
    }

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
        return "";
    }

    return date.toLocaleString("fa-IR", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
    });

}


/* =========================
   مبلغ
========================= */

function formatMoney(value) {

    return (
        Number(value || 0).toLocaleString("fa-IR")
        + " تومان"
    );

}


/* =========================
   نوع اعلان
========================= */

function getNotificationType(item) {

    if (item.type) {
        return String(item.type);
    }

    return "info";

}


function getNotificationIcon(item) {

    if (item.icon) {
        return String(item.icon);
    }

    const type =
        getNotificationType(item);

    if (type === "success") {
        return "✅";
    }

    if (type === "danger") {
        return "❌";
    }

    if (type === "warning") {
        return "⚠️";
    }

    return "🔔";

}


/* =========================
   دریافت اعلان‌ها
========================= */

async function loadNotifications() {

    const container =
        document.getElementById(
            "notificationsContainer"
        );

    container.innerHTML = `
        <div class="loading">
            در حال دریافت اعلان‌ها...
        </div>
    `;


    try {

        const response =
            await fetch(
                `${API_URL}/api/notifications?limit=100`,
                {
                    method: "GET",
                    headers: authHeaders()
                }
            );


        if (response.status === 401) {

            handleUnauthorized();
            return;

        }


        if (!response.ok) {

            throw new Error(
                "دریافت اعلان‌ها ناموفق بود."
            );

        }


        const data =
            await response.json();


        if (Array.isArray(data)) {

            notifications = data;

        } else if (
            Array.isArray(data.notifications)
        ) {

            notifications =
                data.notifications;

        } else {

            notifications = [];

        }


        renderNotifications();


        await loadUnreadCount();

    } catch (error) {

        console.error(
            "Notifications error:",
            error
        );


        container.innerHTML = `
            <div class="error">
                ❌ دریافت اعلان‌ها انجام نشد.
                <br>
                لطفاً اتصال اینترنت و سرور را بررسی کنید.
                <br><br>
                <button
                    class="primary"
                    onclick="loadNotifications()"
                >
                    تلاش دوباره
                </button>
            </div>
        `;

    }

}


/* =========================
   تعداد خوانده‌نشده
========================= */

async function loadUnreadCount() {

    try {

        const response =
            await fetch(
                `${API_URL}/api/notifications/unread-count`,
                {
                    method: "GET",
                    headers: authHeaders()
                }
            );


        if (response.status === 401) {

            handleUnauthorized();
            return;

        }


        if (!response.ok) {
            return;
        }


        const data =
            await response.json();


        const count =
            Number(
                data.unread_count ??
                data.count ??
                0
            );


        document.getElementById(
            "unreadCount"
        ).textContent =
            count.toLocaleString("fa-IR");


        updateHeaderBadge(count);

    } catch (error) {

        console.error(
            "Unread count error:",
            error
        );

    }

}


/* =========================
   نمایش اعلان‌ها
========================= */

function renderNotifications() {

    const container =
        document.getElementById(
            "notificationsContainer"
        );


    const total =
        notifications.length;


    const unread =
        notifications.filter(
            item =>
                !Boolean(
                    item.is_read ??
                    item.read
                )
        ).length;


    document.getElementById(
        "totalCount"
    ).textContent =
        total.toLocaleString("fa-IR");


    document.getElementById(
        "unreadCount"
    ).textContent =
        unread.toLocaleString("fa-IR");


    updateHeaderBadge(unread);


    if (total === 0) {

        container.innerHTML = `
            <div class="empty">
                <div style="font-size:45px;">🔔</div>
                <br>
                هنوز اعلانی وجود ندارد.
            </div>
        `;

        return;

    }


    container.innerHTML =
        notifications.map(item => {

            const id =
                item.id;

            const type =
                getNotificationType(item);

            const icon =
                getNotificationIcon(item);

            const isRead =
                Boolean(
                    item.is_read ??
                    item.read
                );


            return `
                <div
                    class="notification
                           ${escapeHtml(type)}
                           ${isRead ? "" : "unread"}"
                    style="${
                        isRead
                            ? "opacity:.65;"
                            : ""
                    }"
                >

                    <div class="notification-icon">
                        ${escapeHtml(icon)}
                    </div>


                    <div class="notification-content">

                        <div class="notification-title">
                            ${escapeHtml(
                                item.title ||
                                "اعلان کیف‌یار"
                            )}
                        </div>


                        <div class="notification-message">
                            ${escapeHtml(
                                item.message ||
                                ""
                            )}
                        </div>


                        ${
                            item.amount !== undefined &&
                            item.amount !== null
                                ? `
                                    <div
                                        class="notification-time"
                                        style="
                                            color:#2563eb;
                                            font-weight:bold;
                                        "
                                    >
                                        مبلغ:
                                        ${formatMoney(item.amount)}
                                    </div>
                                  `
                                : ""
                        }


                        ${
                            item.created_at
                                ? `
                                    <div class="notification-time">
                                        ${formatDate(
                                            item.created_at
                                        )}
                                    </div>
                                  `
                                : ""
                        }

                    </div>


                    <div class="notification-actions">

                        ${
                            !isRead
                                ? `
                                    <button
                                        class="success"
                                        onclick="markAsRead(${Number(id)})"
                                    >
                                        خواندم
                                    </button>
                                  `
                                : ""
                        }


                        <button
                            class="danger"
                            onclick="deleteNotification(${Number(id)})"
                        >
                            حذف
                        </button>

                    </div>

                </div>
            `;

        }).join("");

}


/* =========================
   Badge
========================= */

function updateHeaderBadge(count) {

    const badge =
        document.getElementById(
            "headerUnreadBadge"
        );


    if (!count || count <= 0) {

        badge.style.display =
            "none";

        return;

    }


    badge.style.display =
        "inline-flex";


    badge.textContent =
        Number(count)
            .toLocaleString("fa-IR");

}


/* =========================
   خواندن یک اعلان
========================= */

async function markAsRead(id) {

    try {

        const response =
            await fetch(
                `${API_URL}/api/notifications/${id}/read`,
                {
                    method: "PATCH",
                    headers: authHeaders()
                }
            );


        if (response.status === 401) {

            handleUnauthorized();
            return;

        }


        if (!response.ok) {

            throw new Error(
                "خواندن اعلان ناموفق بود."
            );

        }


        notifications =
            notifications.map(item => {

                if (
                    String(item.id) ===
                    String(id)
                ) {

                    return {
                        ...item,
                        is_read: true,
                        read: true
                    };

                }

                return item;

            });


        renderNotifications();

        await loadUnreadCount();

    } catch (error) {

        console.error(
            "Mark notification read error:",
            error
        );


        alert(
            "خواندن اعلان انجام نشد."
        );

    }

}


/* =========================
   خواندن همه
========================= */

async function markAllAsRead() {

    if (notifications.length === 0) {
        return;
    }


    const button =
        document.getElementById(
            "markAllButton"
        );


    button.disabled = true;


    try {

        const response =
            await fetch(
                `${API_URL}/api/notifications/read-all`,
                {
                    method: "PATCH",
                    headers: authHeaders()
                }
            );


        if (response.status === 401) {

            handleUnauthorized();
            return;

        }


        if (!response.ok) {

            throw new Error(
                "خواندن همه اعلان‌ها ناموفق بود."
            );

        }


        notifications =
            notifications.map(item => ({
                ...item,
                is_read: true,
                read: true
            }));


        renderNotifications();

        await loadUnreadCount();

    } catch (error) {

        console.error(
            "Mark all notifications error:",
            error
        );


        alert(
            "خواندن همه اعلان‌ها انجام نشد."
        );

    } finally {

        button.disabled = false;

    }

}


/* =========================
   حذف یک اعلان
========================= */

async function deleteNotification(id) {

    try {

        const response =
            await fetch(
                `${API_URL}/api/notifications/${id}`,
                {
                    method: "DELETE",
                    headers: authHeaders()
                }
            );


        if (response.status === 401) {

            handleUnauthorized();
            return;

        }


        if (!response.ok) {

            throw new Error(
                "حذف اعلان ناموفق بود."
            );

        }


        notifications =
            notifications.filter(
                item =>
                    String(item.id) !==
                    String(id)
            );


        renderNotifications();

        await loadUnreadCount();

    } catch (error) {

        console.error(
            "Delete notification error:",
            error
        );


        alert(
            "حذف اعلان انجام نشد."
        );

    }

}


/* =========================
   پاک کردن همه اعلان‌ها
========================= */

async function clearNotifications() {

    if (notifications.length === 0) {
        return;
    }


    const confirmed =
        confirm(
            "آیا می‌خواهید همه اعلان‌ها پاک شوند؟"
        );


    if (!confirmed) {
        return;
    }


    try {

        /*
         * حذف همه اعلان‌ها با حذف تک‌تک آن‌ها
         * تا نیازی به endpoint اضافه نباشد.
         */

        const ids =
            notifications
                .map(item => item.id)
                .filter(
                    id =>
                        id !== undefined &&
                        id !== null
                );


        for (const id of ids) {

            const response =
                await fetch(
                    `${API_URL}/api/notifications/${id}`,
                    {
                        method: "DELETE",
                        headers: authHeaders()
                    }
                );


            if (
                response.status === 401
            ) {

                handleUnauthorized();
                return;

            }

        }


        notifications = [];

        renderNotifications();

        await loadUnreadCount();

    } catch (error) {

        console.error(
            "Clear notifications error:",
            error
        );


        /*
         * حتی اگر حذف یکی از اعلان‌ها خطا بدهد،
         * دوباره لیست واقعی سرور را می‌گیریم.
         */

        await loadNotifications();

        alert(
            "پاک کردن همه اعلان‌ها کامل انجام نشد."
        );

    }

}


/* =========================
   بروزرسانی خودکار
========================= */

setInterval(
    () => {

        loadNotifications();

    },
    15000
);


/* =========================
   شروع صفحه
========================= */

loadNotifications();

</script>

</body>
</html>
