<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>تغییر رمز عبور | KifYar</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family:
                Tahoma,
                Arial,
                sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            max-width: 650px;
            margin: 30px auto;
        }

        .card {
            background: #fff;
            border-radius: 18px;
            padding: 24px;
            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.07);
        }

        h1 {
            text-align: center;
            margin: 0 0 10px;

        .subtitle {
            text-align: center;

            display: none;

            display: block;
        }

        .message.error {
            background: #ffebee;

        .message.success {

            color: #2e7d32;

            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 8px;

            width: 100%;

</head>


<body>

<div class="container">

    <div class="card">

        <h1>
            🔐 تغییر رمز عبور
        </h1>

        <div class="subtitle">
            برای امنیت حساب خود، رمز عبور فعلی و رمز عبور جدید را وارد کنید.
        </div>


        <div
            id="message"
            class="message"
        ></div>


        <form id="passwordForm">

            <div class="field">

                <label for="currentPassword">
                    رمز عبور فعلی
                </label>

                <input
                    type="password"
                    id="currentPassword"
                    name="currentPassword"
                    autocomplete="current-password"
                    required
                >

            </div>


            <div class="field">

                <label for="newPassword">
                    رمز عبور جدید
                </label>

                <input
                    type="password"
                    id="newPassword"
                    name="newPassword"
                    autocomplete="new-password"
                    required
                >

                <div class="password-help">
                    رمز جدید را طوری انتخاب کنید که حدس زدن آن سخت باشد.
                </div>

            </div>


            <div class="field">

                <label for="confirmPassword">
                    تکرار رمز عبور جدید
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    autocomplete="new-password"
                    required
                >

            </div>


            <button
                type="submit"
                id="changePasswordButton"
            >
                🔐 تغییر رمز عبور
            </button>


            <button
                type="button"
                id="backButton"
            >
                🔙 بازگشت به تنظیمات
            </button>

        </form>

    </div>

</div>


<script>

"use strict";


// =========================================================
// API
// =========================================================

const API_URL =
    "https://kifyar-api.onrender.com";


// =========================================================
// STORAGE
// =========================================================

const TOKEN_KEY =
    "kifyar_token";


// =========================================================
// ELEMENTS
// =========================================================

const passwordForm =
    document.getElementById(
        "passwordForm"
    );


const currentPassword =
    document.getElementById(
        "currentPassword"
    );


const newPassword =
    document.getElementById(
        "newPassword"
    );


const confirmPassword =
    document.getElementById(
        "confirmPassword"
    );


const changePasswordButton =
    document.getElementById(
        "changePasswordButton"
    );


const backButton =
    document.getElementById(
        "backButton"
    );


const message =
    document.getElementById(
        "message"
    );


// =========================================================
// TOKEN
// =========================================================

function getToken() {

    return (
        localStorage.getItem(
            TOKEN_KEY
        ) || ""
    );

}


// =========================================================
// LOGIN
// =========================================================

function goToLogin() {

    window.location.assign(
        "login.html"
    );

}


// =========================================================
// SETTINGS
// =========================================================

function goToSettings() {

    window.location.assign(
        "settings.html"
    );

}


// =========================================================
// MESSAGE
// =========================================================

function showMessage(
    text,
    type
) {

    message.textContent =
        text;

    message.className =
        "message show " +
        type;

}


function hideMessage() {

    message.textContent =
        "";

    message.className =
        "message";

}


// =========================================================
// AUTH CHECK
// =========================================================

if (
    !getToken()
) {

    goToLogin();

}


// =========================================================
// PASSWORD FORM
// =========================================================

passwordForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        hideMessage();


        const token =
            getToken();


        if (!token) {

            goToLogin();

            return;

        }


        const current =
            currentPassword.value.trim();


        const newPass =
            newPassword.value;


        const confirm =
            confirmPassword.value;


        if (!current) {

            showMessage(
                "رمز عبور فعلی را وارد کنید.",
                "error"
            );

            currentPassword.focus();

            return;

        }


        if (!newPass) {

            showMessage(
                "رمز عبور جدید را وارد کنید.",
                "error"
            );

            newPassword.focus();

            return;

        }


        if (newPass.length < 6) {

            showMessage(
                "رمز عبور جدید باید حداقل ۶ کاراکتر باشد.",
                "error"
            );

            newPassword.focus();

            return;

        }


        if (newPass !== confirm) {

            showMessage(
                "تکرار رمز عبور جدید با رمز جدید یکسان نیست.",
                "error"
            );

            confirmPassword.focus();

            return;

        }


        if (current === newPass) {

            showMessage(
                "رمز عبور جدید باید با رمز قبلی متفاوت باشد.",
                "error"
            );

            newPassword.focus();

            return;

        }


        changePasswordButton.disabled =
            true;

        changePasswordButton.textContent =
            "در حال تغییر رمز عبور...";


        try {

            const response =
                await fetch(
                    API_URL +
                    "/api/password",
                    {
                        method:
                            "PUT",

                        headers: {
                            "Authorization":
                                "Bearer " +
                                token,

                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                current_password:
                                    current,

                                new_password:
                                    newPass
                            })
                    }
                );


            let data = null;

            try {

                data =
                    await response.json();

            } catch (
                jsonError
            ) {

                data = null;

            }


            if (
                response.status === 401
            ) {

                localStorage.removeItem(
                    TOKEN_KEY
                );

                showMessage(
                    "نشست شما منقضی شده است. دوباره وارد حساب شوید.",
                    "error"
                );

                setTimeout(
                    goToLogin,
                    1000
                );

                return;

            }


            if (!response.ok) {

                const errorText =
                    data &&
                    (
                        data.detail ||
                        data.message
                    );

                throw new Error(
                    errorText ||
                    "تغییر رمز عبور انجام نشد."
                );

            }


            showMessage(
                (
                    data &&
                    data.message
                ) ||
                "رمز عبور با موفقیت تغییر کرد.",
                "success"
            );


            passwordForm.reset();


            setTimeout(
                function() {

                    goToSettings();

                },
                1200
            );


        } catch (
            error
        ) {

            console.error(
                "Change password error:",
                error
            );


            showMessage(
                error.message ||
                "ارتباط با سرور برقرار نشد.",
                "error"
            );


        } finally {

            changePasswordButton.disabled =
                false;

            changePasswordButton.textContent =
                "🔐 تغییر رمز عبور";

        }

    }
);


// =========================================================
// BACK
// =========================================================

backButton.addEventListener(
    "click",
    function() {

        goToSettings();

    }
);

</script>

</body>

</html>
