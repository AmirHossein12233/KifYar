<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KifYar - تغییر رمز عبور</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>
        .password-card {
            margin-top: 20px;
            padding: 22px;
            border-radius: 22px;
            background: #ffffff;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
        }

        .password-card h2 {
            margin-bottom: 18px;
            font-size: 19px;
        }

        .field {
            margin-bottom: 15px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            font-size: 12px;
            font-weight: bold;
        }

        .field input {
            width: 100%;
            height: 47px;
            padding: 0 13px;
            box-sizing: border-box;
            border: 1px solid #dce3eb;
            border-radius: 12px;
            outline: none;
            font-family: inherit;
            font-size: 13px;
        }

        .field input:focus {
            border-color: #1769ff;
        }

        .save-button {
            width: 100%;
            min-height: 48px;
            border: none;
            border-radius: 13px;
            background: #1769ff;
            color: #ffffff;
            font-family: inherit;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .save-button:active {
            transform: scale(0.98);
        }

        .save-button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .back-button {
            width: 100%;
            min-height: 46px;
            margin-top: 10px;
            border: none;
            border-radius: 13px;
            background: #eef2f6;
            color: #374151;
            font-family: inherit;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .back-button:active {
            transform: scale(0.98);
        }

        .message {
            min-height: 24px;
            margin-top: 13px;
            text-align: center;
            font-size: 12px;
        }

        .success {
            color: #15945a;
        }

        .error {
            color: #d94848;
        }
    </style>

</head>

<body>

<header class="topbar">

    <div class="brand">

        <div class="logo">
            ک
        </div>

        <div>
            <h1>KifYar</h1>
            <span>تغییر رمز عبور</span>
        </div>

    </div>

    <button
        class="profile-btn"
        id="backProfileButton"
        type="button"
    >
        👤
    </button>

</header>


<main>

    <section class="password-card">

        <h2>
            تغییر رمز عبور
        </h2>


        <div class="field">

            <label for="currentPassword">
                رمز عبور فعلی
            </label>

            <input
                id="currentPassword"
                type="password"
                autocomplete="current-password"
                placeholder="رمز عبور فعلی"
            >

        </div>


        <div class="field">

            <label for="newPassword">
                رمز عبور جدید
            </label>

            <input
                id="newPassword"
                type="password"
                autocomplete="new-password"
                minlength="4"
                placeholder="حداقل ۴ کاراکتر"
            >

        </div>


        <div class="field">

            <label for="confirmPassword">
                تکرار رمز عبور جدید
            </label>

            <input
                id="confirmPassword"
                type="password"
                autocomplete="new-password"
                minlength="4"
                placeholder="تکرار رمز عبور جدید"
            >

        </div>


        <button
            class="save-button"
            id="saveButton"
            type="button"
        >
            تغییر رمز عبور
        </button>


        <button
            class="back-button"
            id="backButton"
            type="button"
        >
            بازگشت به پروفایل
        </button>


        <div
            class="message"
            id="message"
        ></div>

    </section>

</main>


<script>

const API_URL =
    "https://kifyar-api.onrender.com";


const TOKEN_KEY =
    "kifyar_token";


const USER_KEY =
    "kifyar_user";


const currentPassword =
    document.getElementById(
        "currentPassword"
    );


const newPassword =
    document.getElementById(
        "newPassword"
    );


const confirmPassword =
    document.getElementById(
        "confirmPassword"
    );


const saveButton =
    document.getElementById(
        "saveButton"
    );


const message =
    document.getElementById(
        "message"
    );


function getToken() {

    return localStorage.getItem(
        TOKEN_KEY
    );

}


function clearSession() {

    localStorage.removeItem(
        TOKEN_KEY
    );

    localStorage.removeItem(
        USER_KEY
    );

}


function goLogin() {

    clearSession();

    window.location.replace(
        "/frontend/login.html"
    );

}


function goProfile() {

    window.location.href =
        "/frontend/profile.html";

}


function showMessage(
    text,
    type
) {

    message.textContent =
        text;

    message.className =
        "message";

    if (type) {

        message.classList.add(
            type
        );

    }

}


async function changePassword() {

    const current =
        currentPassword.value;

    const password =
        newPassword.value;

    const confirm =
        confirmPassword.value;


    if (!current) {

        showMessage(
            "رمز عبور فعلی را وارد کنید.",
            "error"
        );

        currentPassword.focus();

        return;

    }


    if (password.length < 4) {

        showMessage(
            "رمز عبور جدید باید حداقل ۴ کاراکتر باشد.",
            "error"
        );

        newPassword.focus();

        return;

    }


    if (password !== confirm) {

        showMessage(
            "رمز عبور جدید و تکرار آن یکسان نیست.",
            "error"
        );

        confirmPassword.focus();

        return;

    }


    if (current === password) {

        showMessage(
            "رمز عبور جدید باید با رمز قبلی متفاوت باشد.",
            "error"
        );

        newPassword.focus();

        return;

    }


    const token =
        getToken();


    if (!token) {

        goLogin();

        return;

    }


    saveButton.disabled =
        true;

    saveButton.textContent =
        "در حال تغییر...";


    showMessage(
        "",
        ""
    );


    try {

        const response =
            await fetch(
                API_URL +
                "/api/profile/password",
                {
                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            token
                    },

                    body:
                        JSON.stringify({
                            current_password:
                                current,

                            new_password:
                                password
                        }),

                    cache: "no-store"
                }
            );


        let data = null;


        try {

            data =
                await response.json();

        } catch (error) {

            data = null;

        }


        if (
            response.status ===
            401
        ) {

            goLogin();

            return;

        }


        if (!response.ok) {

            showMessage(
                data?.detail ||
                data?.message ||
                "تغییر رمز عبور انجام نشد.",
                "error"
            );

            return;

        }


        if (
            data &&
            data.success === false
        ) {

            showMessage(
                data.message ||
                "تغییر رمز عبور انجام نشد.",
                "error"
            );

            return;

        }


        showMessage(
            data?.message ||
            "رمز عبور با موفقیت تغییر کرد.",
            "success"
        );


        currentPassword.value =
            "";

        newPassword.value =
            "";

        confirmPassword.value =
            "";


    } catch (error) {

        console.error(
            "changePassword:",
            error
        );


        showMessage(
            "اتصال به سرور برقرار نشد.",
            "error"
        );

    } finally {

        saveButton.disabled =
            false;

        saveButton.textContent =
            "تغییر رمز عبور";

    }

}


if (!getToken()) {

    goLogin();

}


document
    .getElementById(
        "backProfileButton"
    )
    .addEventListener(
        "click",
        goProfile
    );


document
    .getElementById(
        "backButton"
    )
    .addEventListener(
        "click",
        goProfile
    );


saveButton.addEventListener(
    "click",
    changePassword
);


confirmPassword.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key ===
            "Enter"
        ) {

            changePassword();

        }

    }
);

</script>

</body>

</html>
