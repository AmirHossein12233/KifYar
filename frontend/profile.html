<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>پروفایل | KifYar</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Tahoma, Arial, sans-serif;
            background: #f4f6f8;
            color: #111827;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }

        .header {
            background: #111827;
            color: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 18px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 25px;
        }

        .header p {
            margin: 0;
            color: #cbd5e1;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
        }

        .profile-top {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .profile-info {
            min-width: 0;
        }

        .profile-info h2 {
            margin: 0 0 7px;
            font-size: 21px;
        }

        .profile-info p {
            margin: 4px 0;
            color: #64748b;
            word-break: break-word;
        }

        .balance-box {
            background: #eff6ff;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }

        .balance-title {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .balance {
            font-size: 28px;
            font-weight: bold;
            color: #1d4ed8;
        }

        .balance-sub {
            margin-top: 8px;
            color: #64748b;
            font-size: 13px;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .menu button {
            width: 100%;
            border: 0;
            border-radius: 13px;
            padding: 15px;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: right;
            transition: 0.15s;
        }

        .menu button:hover {
            transform: translateY(-1px);
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .primary:hover {
            background: #1d4ed8;
        }

        .secondary {
            background: #e5e7eb;
            color: #111827;
        }

        .secondary:hover {
            background: #d1d5db;
        }

        .danger {
            background: #fee2e2;
            color: #991b1b;
        }

        .danger:hover {
            background: #fecaca;
        }

        .message {
            display: none;
            padding: 13px;
            border-radius: 12px;
            margin-bottom: 18px;
            line-height: 1.8;
        }

        .message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .loading {
            color: #64748b;
            text-align: center;
            padding: 10px;
        }

        .footer {
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
            padding: 10px;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .header {
                padding: 20px;
            }

            .balance {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>👤 پروفایل KifYar</h1>
        <p>مدیریت حساب و کیف پول شما</p>
    </div>

    <div id="message" class="message"></div>

    <!-- PROFILE -->
    <div class="card">

        <div class="profile-top">

            <div id="avatar" class="avatar">
                ؟
            </div>

            <div class="profile-info">

                <h2 id="fullName">
                    در حال دریافت...
                </h2>

                <p id="username">
                    نام کاربری: ...
                </p>

                <p id="email">
                    ایمیل: ...
                </p>

            </div>

        </div>

    </div>

    <!-- BALANCE -->
    <div class="card">

        <h2>💰 کیف پول</h2>

        <div class="balance-box">

            <div class="balance-title">
                موجودی فعلی
            </div>

            <div id="balance" class="balance">
                ۰ تومان
            </div>

            <div id="balanceInfo" class="balance-sub">
                در حال دریافت موجودی...
            </div>

        </div>

    </div>

    <!-- MENU -->
    <div class="card">

        <h2>مدیریت حساب</h2>

        <div class="menu">

            <!-- افزایش موجودی -->
            <button
                type="button"
                class="primary"
                onclick="goToDeposit()"
            >
                💰 افزایش موجودی
            </button>

            <!-- برداشت -->
            <button
                type="button"
                class="primary"
                onclick="goToWithdraw()"
            >
                💳 برداشت وجه
            </button>

            <!-- تراکنش‌ها -->
            <button
                type="button"
                class="secondary"
                onclick="goToTransactions()"
            >
                📋 تراکنش‌های من
            </button>

            <!-- کارت‌ها -->
            <button
                type="button"
                class="secondary"
                onclick="goToCards()"
            >
                💳 کارت‌های بانکی
            </button>

            <!-- تنظیمات -->
            <button
                type="button"
                class="secondary"
                onclick="goToSettings()"
            >
                ⚙️ تنظیمات
            </button>

            <!-- خروج -->
            <button
                type="button"
                class="danger"
                onclick="logout()"
            >
                🚪 خروج از حساب
            </button>

        </div>

    </div>

    <div class="footer">
        KifYar — نسخه 1.0.0
    </div>

</div>

<script>

const API_URL = "https://kifyar-api.onrender.com";


/* =========================================================
   TOKEN
========================================================= */

function getToken() {

    return (
        localStorage.getItem("token") ||
        localStorage.getItem("access_token") ||
        localStorage.getItem("kifyar_token") ||
        ""
    );
}


/* =========================================================
   HEADERS
========================================================= */

function getHeaders() {

    const token = getToken();

    const headers = {
        "Content-Type": "application/json"
    };

    if (token) {
        headers["Authorization"] =
            "Bearer " + token;
    }

    return headers;
}


/* =========================================================
   API
========================================================= */

async function apiFetch(url, options = {}) {

    const response = await fetch(
        API_URL + url,
        {
            ...options,
            headers: {
                ...getHeaders(),
                ...(options.headers || {})
            }
        }
    );

    let data = {};

    try {
        data = await response.json();
    } catch {
        data = {};
    }

    if (!response.ok) {

        throw new Error(
            data.detail ||
            data.message ||
            data.error ||
            "خطا در ارتباط با سرور"
        );
    }

    return data;
}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text, type) {

    const element =
        document.getElementById("message");

    element.textContent = text;

    element.className =
        "message " + type;
}


/* =========================================================
   MONEY
========================================================= */

function formatMoney(value) {

    const number =
        Number(value || 0);

    return (
        new Intl.NumberFormat("fa-IR")
            .format(number)
        + " تومان"
    );
}


/* =========================================================
   PROFILE
========================================================= */

async function loadProfile() {

    try {

        const data =
            await apiFetch("/api/me");

        const user =
            data.user ||
            data;

        const fullName =
            user.full_name ||
            user.name ||
            user.display_name ||
            user.username ||
            "کاربر";

        const username =
            user.username ||
            "-";

        const email =
            user.email ||
            "-";

        document.getElementById(
            "fullName"
        ).textContent = fullName;

        document.getElementById(
            "username"
        ).textContent =
            "نام کاربری: " + username;

        document.getElementById(
            "email"
        ).textContent =
            "ایمیل: " + email;

        const avatar =
            document.getElementById("avatar");

        const firstLetter =
            String(fullName)
                .trim()
                .charAt(0);

        avatar.textContent =
            firstLetter || "👤";

        localStorage.setItem(
            "kifyar_user",
            JSON.stringify(user)
        );

    } catch (error) {

        console.error(error);

        showMessage(
            error.message ||
            "دریافت اطلاعات حساب ناموفق بود.",
            "error"
        );
    }
}


/* =========================================================
   BALANCE
========================================================= */

async function loadBalance() {

    try {

        const data =
            await apiFetch("/api/balance");

        const balance =
            data.balance ??
            data.current_balance ??
            0;

        const reserved =
            data.reserved ??
            data.reserved_balance ??
            0;

        const available =
            data.available ??
            data.available_balance ??
            Math.max(
                Number(balance) -
                Number(reserved),
                0
            );

        document.getElementById(
            "balance"
        ).textContent =
            formatMoney(balance);

        document.getElementById(
            "balanceInfo"
        ).textContent =
            "قابل برداشت: " +
            formatMoney(available) +
            " | رزرو شده: " +
            formatMoney(reserved);

    } catch (error) {

        console.error(error);

        document.getElementById(
            "balance"
        ).textContent =
            "خطا";

        document.getElementById(
            "balanceInfo"
        ).textContent =
            "امکان دریافت موجودی وجود ندارد.";
    }
}


/* =========================================================
   NAVIGATION
========================================================= */

function goToWithdraw() {

    window.location.href =
        "withdraw.html";
}


function goToDeposit() {

    window.location.href =
        "deposit.html";
}


function goToTransactions() {

    window.location.href =
        "transactions.html";
}


function goToCards() {

    window.location.href =
        "cards.html";
}


function goToSettings() {

    window.location.href =
        "settings.html";
}


/* =========================================================
   LOGOUT
========================================================= */

async function logout() {

    try {

        await apiFetch(
            "/api/logout",
            {
                method: "POST"
            }
        );

    } catch (error) {

        console.warn(
            "Logout API:",
            error
        );

    } finally {

        localStorage.removeItem("token");
        localStorage.removeItem("access_token");
        localStorage.removeItem("kifyar_token");
        localStorage.removeItem("kifyar_user");

        window.location.href =
            "login.html";
    }
}


/* =========================================================
   AUTH CHECK
========================================================= */

async function checkAuth() {

    const token =
        getToken();

    if (!token) {

        showMessage(
            "ابتدا وارد حساب خود شوید.",
            "error"
        );

        setTimeout(() => {

            window.location.href =
                "login.html";

        }, 1200);

        return false;
    }

    return true;
}


/* =========================================================
   START
========================================================= */

async function startPage() {

    const authenticated =
        await checkAuth();

    if (!authenticated) {
        return;
    }

    await Promise.all([
        loadProfile(),
        loadBalance()
    ]);
}


window.addEventListener(
    "DOMContentLoaded",
    startPage
);

</script>

</body>
</html>
