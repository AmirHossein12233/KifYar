<body>

    <div class="login-box">

        <div class="logo">
            ک
        </div>

        <h1>
            ورود به کیف‌یار
        </h1>

        <div class="subtitle">
            وارد حساب خود شوید
        </div>


        <form id="loginForm">

            <div class="field">

                <label for="username">
                    نام کاربری
                </label>

                <input
                    id="username"
                    name="username"
                    type="text"
                    autocomplete="username"
                    placeholder="نام کاربری خود را وارد کنید"
                    required
                >

            </div>


            <div class="field">

                <label for="password">
                    رمز عبور
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="رمز عبور خود را وارد کنید"
                    required
                >

            </div>


            <button
                id="loginButton"
                type="submit"
            >
                ورود
            </button>


            <div
                id="message"
                class="message"
            ></div>

        </form>


        <div class="register">

            حساب ندارید؟

            <a href="/register.html">
                ثبت‌نام کنید
            </a>

        </div>

    </div>


<script>

    // =====================================================
    // API
    // =====================================================

    const API_BASE =
        "https://kifyar-api.onrender.com";


    // =====================================================
    // STORAGE
    // =====================================================

    const TOKEN_KEY =
        "kifyar_token";

    const USER_KEY =
        "kifyar_user";


    const OLD_TOKEN_KEYS = [
        "access_token",
        "auth_token",
        "gapino_token"
    ];


    const OLD_USER_KEYS = [
        "gapino_user"
    ];


    // =====================================================
    // ELEMENTS
    // =====================================================

    const loginForm =
        document.getElementById(
            "loginForm"
        );


    const loginButton =
        document.getElementById(
            "loginButton"
        );


    const messageBox =
        document.getElementById(
            "message"
        );


    // =====================================================
    // MESSAGE
    // =====================================================

    function showMessage(
        text,
        type = "error"
    ) {

        messageBox.textContent =
            text;

        messageBox.className =
            "message " + type;

        messageBox.style.display =
            "block";
    }


    function hideMessage() {

        messageBox.textContent =
            "";

        messageBox.className =
            "message";

        messageBox.style.display =
            "none";
    }


    // =====================================================
    // CLEAR OLD AUTH
    // =====================================================

    function clearOldAuth() {

        localStorage.removeItem(
            TOKEN_KEY
        );

        localStorage.removeItem(
            USER_KEY
        );


        OLD_TOKEN_KEYS.forEach(
            function(key) {

                localStorage.removeItem(
                    key
                );

            }
        );


        OLD_USER_KEYS.forEach(
            function(key) {

                localStorage.removeItem(
                    key
                );

            }
        );


        sessionStorage.removeItem(
            TOKEN_KEY
        );

        sessionStorage.removeItem(
            USER_KEY
        );
    }


    // =====================================================
    // HOME
    // =====================================================

    function goToHome() {

        window.location.assign(
            "/index.html"
        );
    }


    // =====================================================
    // EXISTING SESSION
    // =====================================================

    const existingToken =
        localStorage.getItem(
            TOKEN_KEY
        );


    if (existingToken) {

        goToHome();
    }


    // =====================================================
    // LOGIN
    // =====================================================

    loginForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const username =
                document
                    .getElementById(
                        "username"
                    )
                    .value
                    .trim();


            const password =
                document
                    .getElementById(
                        "password"
                    )
                    .value;


            // -------------------------------------------------
            // Validation
            // -------------------------------------------------

            if (!username) {

                showMessage(
                    "نام کاربری را وارد کنید."
                );

                return;
            }


            if (!password) {

                showMessage(
                    "رمز عبور را وارد کنید."
                );

                return;
            }


            // -------------------------------------------------
            // Loading
            // -------------------------------------------------

            loginButton.disabled =
                true;

            loginButton.textContent =
                "در حال ورود...";

            hideMessage();


            try {

                // -------------------------------------------------
                // Request
                // -------------------------------------------------

                const response =
                    await fetch(
                        API_BASE +
                        "/api/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json",

                                "Accept":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(
                                    {
                                        username:
                                            username,

                                        password:
                                            password
                                    }
                                )
                        }
                    );


                // -------------------------------------------------
                // Read response
                // -------------------------------------------------

                const rawText =
                    await response.text();


                let data = null;


                try {

                    data =
                        rawText
                            ? JSON.parse(
                                rawText
                              )
                            : null;

                } catch {

                    throw new Error(
                        "پاسخ سرور قابل خواندن نیست."
                    );
                }


                // -------------------------------------------------
                // HTTP ERROR
                // -------------------------------------------------

                if (!response.ok) {

                    let errorMessage =
                        "نام کاربری یا رمز عبور اشتباه است.";


                    if (
                        data &&
                        typeof data.detail
                        === "string"
                    ) {

                        errorMessage =
                            data.detail;

                    }


                    else if (
                        data &&
                        Array.isArray(
                            data.detail
                        )
                    ) {

                        errorMessage =
                            data.detail
                                .map(
                                    function(item) {

                                        return (
                                            item.msg
                                            ||
                                            "خطای ورود"
                                        );

                                    }
                                )
                                .join(
                                    "، "
                                );

                    }


                    else if (
                        data &&
                        typeof data.message
                        === "string"
                    ) {

                        errorMessage =
                            data.message;
                    }


                    throw new Error(
                        errorMessage
                    );
                }


                // -------------------------------------------------
                // Response validation
                // -------------------------------------------------

                if (!data) {

                    throw new Error(
                        "پاسخ معتبری از سرور دریافت نشد."
                    );
                }


                // -------------------------------------------------
                // Token
                // -------------------------------------------------

                const token =
                    data.token
                    ||
                    data.access_token;


                if (!token) {

                    throw new Error(
                        "توکن ورود از سرور دریافت نشد."
                    );
                }


                // -------------------------------------------------
                // Save auth
                // -------------------------------------------------

                clearOldAuth();


                localStorage.setItem(
                    TOKEN_KEY,
                    token
                );


                if (data.user) {

                    localStorage.setItem(
                        USER_KEY,
                        JSON.stringify(
                            data.user
                        )
                    );
                }


                // -------------------------------------------------
                // Success
                // -------------------------------------------------

                showMessage(
                    "ورود با موفقیت انجام شد.",
                    "success"
                );


                loginButton.textContent =
                    "ورود موفق";


                // -------------------------------------------------
                // Home
                // -------------------------------------------------

                setTimeout(
                    function() {

                        goToHome();

                    },
                    500
                );


            } catch (error) {

                console.error(
                    "Login error:",
                    error
                );


                showMessage(
                    error &&
                    error.message
                        ? error.message
                        : "خطایی هنگام ورود رخ داد."
                );


                loginButton.disabled =
                    false;

                loginButton.textContent =
                    "ورود";
            }

        }
    );

</script>

</body>

</html>
