</div>

<script>
    const API_BASE = "https://kifyar-api.onrender.com";

    const TOKEN_KEY = "kifyar_token";
    const USER_KEY = "kifyar_user";

    const OLD_TOKEN_KEYS = [
        "access_token",
        "auth_token",
        "gapino_token"
    ];

    const OLD_USER_KEYS = [
        "gapino_user"
    ];

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const messageBox = document.getElementById("message");

    function showMessage(text, type = "error") {
        messageBox.textContent = text;
        messageBox.className = "message " + type;
    }

    function clearOldAuth() {
        localStorage.removeItem(TOKEN_KEY);
        localStorage.removeItem(USER_KEY);

        OLD_TOKEN_KEYS.forEach(key => {
            localStorage.removeItem(key);
        });

        OLD_USER_KEYS.forEach(key => {
            localStorage.removeItem(key);
        });

        sessionStorage.removeItem(TOKEN_KEY);
        sessionStorage.removeItem(USER_KEY);
    }

    function goToHome() {
        window.location.assign("/frontend/index.html");
    }

    // اگر قبلاً وارد شده‌ایم، مستقیماً به صفحه اصلی برو
    const existingToken = localStorage.getItem(TOKEN_KEY);

    if (existingToken) {
        goToHome();
    }

    loginForm.addEventListener("submit", async function(event) {
        event.preventDefault();

        const username = document
            .getElementById("username")
            .value
            .trim();

        const password = document
            .getElementById("password")
            .value;

        if (!username) {
            showMessage("نام کاربری را وارد کنید.");
            return;
        }

        if (!password) {
            showMessage("رمز عبور را وارد کنید.");
            return;
        }

        loginButton.disabled = true;
        loginButton.textContent = "در حال ورود...";

        showMessage("", "success");
        messageBox.style.display = "none";

        try {
            const response = await fetch(
                API_BASE + "/api/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },

                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                }
            );

            const rawText = await response.text();

            let data = null;

            try {
                data = rawText
                    ? JSON.parse(rawText)
                    : null;
            } catch (jsonError) {
                throw new Error(
                    "پاسخ سرور قابل خواندن نیست."
                );
            }

            if (!response.ok) {
                let errorMessage =
                    "نام کاربری یا رمز عبور اشتباه است.";

                if (data) {
                    if (typeof data.detail === "string") {
                        errorMessage = data.detail;
                    } else if (Array.isArray(data.detail)) {
                        errorMessage = data.detail
                            .map(item => item.msg || "خطای ورود")
                            .join("، ");
                    } else if (typeof data.message === "string") {
                        errorMessage = data.message;
                    }
                }

                throw new Error(errorMessage);
            }

            if (!data) {
                throw new Error(
                    "پاسخ معتبری از سرور دریافت نشد."
                );
            }

            const token =
                data.token ||
                data.access_token;

            if (!token) {
                throw new Error(
                    "توکن ورود از سرور دریافت نشد."
                );
            }

            clearOldAuth();

            localStorage.setItem(
                TOKEN_KEY,
                token
            );

            if (data.user) {
                localStorage.setItem(
                    USER_KEY,
                    JSON.stringify(data.user)
                );
            }

            showMessage(
                "ورود با موفقیت انجام شد...",
                "success"
            );

            loginButton.textContent = "ورود موفق";

            setTimeout(() => {
                goToHome();
            }, 300);

        } catch (error) {

            console.error(
                "Login error:",
                error
            );

            showMessage(
                error.message ||
                "خطایی هنگام ورود رخ داد."
            );

            loginButton.disabled = false;
            loginButton.textContent = "ورود";
        }
    });
</script>
