<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>کارت‌های بانکی - کیف‌یار</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
        }

        .page-header h1 {
            margin: 0;
        }

        .page-header a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.05);
        }

        .card h2 {
            margin-top: 0;
        }

        .card p {
            color: #666;
            line-height: 1.8;
        }

        label {
            display: block;
            margin: 14px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            height: 48px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            padding: 0 12px;
            font-family: inherit;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.1);
        }

        .card-button {
            width: 100%;
            height: 50px;
            margin-top: 18px;
            border: none;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-family: inherit;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .card-button:hover {
            background: #1d4ed8;
        }

        .card-button:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        .message {
            display: none;
            margin-top: 14px;
            padding: 12px;
            border-radius: 10px;
            line-height: 1.7;
        }

        .message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .bank-card {
            border: 1px solid #e5e7eb;
            border-radius: 15px;
            padding: 16px;
            margin-bottom: 12px;
            background: #fafafa;
        }

        .bank-card:last-child {
            margin-bottom: 0;
        }

        .bank-card-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .bank-card-row {
            margin-top: 7px;
            color: #555;
        }

        .bank-card-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
        }

        .small-button {
            border: none;
            border-radius: 10px;
            padding: 9px 12px;
            font-family: inherit;
            cursor: pointer;
            background: #e5e7eb;
            color: #222;
        }

        .small-button.primary {
            background: #2563eb;
            color: white;
        }

        .small-button.danger {
            background: #dc2626;
            color: white;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 20px;
        }

        .loading {
            color: #777;
            padding: 15px 0;
        }

    </style>

</head>


<body>

<div class="container">

    <header class="page-header">

        <h1>
            💳 کارت‌های بانکی
        </h1>

        <a href="index.html">
            بازگشت
        </a>

    </header>


    <section class="card">

        <h2>
            ➕ افزودن کارت بانکی
        </h2>

        <p>
            اطلاعات کارت خودت را برای استفاده در کیف‌یار ثبت کن.
        </p>


        <label for="holderName">
            نام صاحب کارت
        </label>

        <input
            id="holderName"
            type="text"
            maxlength="100"
            autocomplete="off"
            placeholder="نام و نام خانوادگی"
        >


        <label for="bankName">
            نام بانک
        </label>

        <input
            id="bankName"
            type="text"
            maxlength="100"
            autocomplete="off"
            placeholder="مثلاً بانک ملی"
        >


        <label for="cardNumber">
            شماره کارت
        </label>

        <input
            id="cardNumber"
            type="text"
            inputmode="numeric"
            maxlength="19"
            autocomplete="off"
            placeholder="6037-xxxx-xxxx-xxxx"
        >


        <button
            id="addCardButton"
            class="card-button"
            type="button"
        >
            افزودن کارت
        </button>


        <div
            id="addMessage"
            class="message"
        ></div>

    </section>


    <section class="card">

        <h2>
            💳 کارت‌های من
        </h2>

        <div id="cardsList">

            <div class="loading">
                در حال دریافت کارت‌ها...
            </div>

        </div>

    </section>

</div>


<script>

const API_URL =
    "https://kifyar-api.onrender.com";

const TOKEN_KEY =
    "kifyar_token";


function getToken() {

    return (
        localStorage.getItem(
            TOKEN_KEY
        ) || ""
    );

}


function ensureLoggedIn() {

    const token =
        getToken();

    if (!token) {

        window.location.href =
            "login.html";

        return false;

    }

    return true;

}


function authHeaders() {

    const token =
        getToken();

    return {

        "Accept":
            "application/json",

        "Content-Type":
            "application/json",

        "Authorization":
            "Bearer " + token

    };

}


async function apiRequest(
    endpoint,
    options = {}
) {

    const response =
        await fetch(
            API_URL + endpoint,
            {
                ...options,

                headers: {
                    ...authHeaders(),
                    ...(options.headers || {})
                }
            }
        );


    if (
        response.status === 401
    ) {

        localStorage.removeItem(
            TOKEN_KEY
        );

        localStorage.removeItem(
            "kifyar_user"
        );

        window.location.href =
            "login.html";

        throw new Error(
            "جلسه ورود معتبر نیست."
        );

    }


    return response;

}


async function readResponse(
    response
) {

    const text =
        await response.text();

    if (!text) {
        return {};
    }

    try {

        return JSON.parse(
            text
        );

    } catch {

        return {
            detail: text
        };

    }

}


function showMessage(
    element,
    message,
    success = false
) {

    element.textContent =
        message;

    element.className =
        success
            ? "message success"
            : "message error";

}


function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


function formatCardNumber(
    value
) {

    const digits =
        String(
            value || ""
        )
        .replace(
            /\D/g,
            ""
        )
        .slice(
            0,
            16
        );

    return digits
        .replace(
            /(.{4})/g,
            "$1-"
        )
        .replace(
            /-$/,
            ""
        );

}


document
    .getElementById(
        "cardNumber"
    )
    .addEventListener(
        "input",
        function () {

            this.value =
                formatCardNumber(
                    this.value
                );

        }
    );


async function loadCards() {

    const list =
        document.getElementById(
            "cardsList"
        );


    list.innerHTML = `
        <div class="loading">
            در حال دریافت کارت‌ها...
        </div>
    `;


    try {

        const response =
            await apiRequest(
                "/api/cards",
                {
                    method: "GET"
                }
            );


        const data =
            await readResponse(
                response
            );


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "دریافت کارت‌ها انجام نشد."
            );

        }


        /*
         * Backend ممکن است مستقیماً
         * آرایه برگرداند:
         *
         * [
         *   {...},
         *   {...}
         * ]
         *
         * یا:
         *
         * {
         *   "cards": [...]
         * }
         *
         * هر دو حالت را پشتیبانی می‌کنیم.
         */

        let cards = [];


        if (
            Array.isArray(
                data
            )
        ) {

            cards =
                data;

        } else if (
            Array.isArray(
                data.cards
            )
        ) {

            cards =
                data.cards;

        }


        if (
            cards.length === 0
        ) {

            list.innerHTML = `
                <div class="empty">
                    هنوز هیچ کارت بانکی ثبت نشده است.
                </div>
            `;

            return;

        }


        list.innerHTML = "";


        cards.forEach(
            card => {

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "bank-card";


                const isDefault =
                    Number(
                        card.is_default || 0
                    ) === 1;


                const bankName =
                    card.bank_name ||
                    card.bank ||
                    "بانک";


                const holderName =
                    card.holder_name ||
                    card.name ||
                    "-";


                const cardNumber =
                    card.masked_card_number ||
                    card.card_number_masked ||
                    card.masked_number ||
                    "****";


                item.innerHTML = `

                    <div class="bank-card-title">
                        💳
                        ${escapeHtml(
                            bankName
                        )}
                    </div>


                    <div class="bank-card-row">

                        صاحب کارت:

                        <strong>
                            ${escapeHtml(
                                holderName
                            )}
                        </strong>

                    </div>


                    <div class="bank-card-row">

                        شماره کارت:

                        <strong>
                            ${escapeHtml(
                                cardNumber
                            )}
                        </strong>

                    </div>


                    <div class="bank-card-row">

                        وضعیت:

                        ${
                            isDefault
                                ? "⭐ کارت پیش‌فرض"
                                : "کارت عادی"
                        }

                    </div>


                    <div class="bank-card-actions">

                        ${
                            !isDefault
                                ? `
                                    <button
                                        type="button"
                                        class="small-button primary"
                                        data-default="${Number(card.id)}"
                                    >
                                        ⭐ انتخاب به‌عنوان پیش‌فرض
                                    </button>
                                  `
                                : ""
                        }


                        <button
                            type="button"
                            class="small-button danger"
                            data-delete="${Number(card.id)}"
                        >
                            🗑 حذف کارت
                        </button>

                    </div>

                `;


                list.appendChild(
                    item
                );

            }
        );


        document
            .querySelectorAll(
                "[data-default]"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () => {

                            setDefaultCard(
                                Number(
                                    button.dataset.default
                                )
                            );

                        }
                    );

                }
            );


        document
            .querySelectorAll(
                "[data-delete]"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () => {

                            deleteCard(
                                Number(
                                    button.dataset.delete
                                )
                            );

                        }
                    );

                }
            );


    } catch (
        error
    ) {

        console.error(
            "Load cards error:",
            error
        );


        list.innerHTML = `
            <div class="message error">
                ${escapeHtml(
                    error.message ||
                    "خطا در دریافت کارت‌ها."
                )}
            </div>
        `;

    }

}


async function addCard() {

    const holderName =
        document
            .getElementById(
                "holderName"
            )
            .value
            .trim();


    const bankName =
        document
            .getElementById(
                "bankName"
            )
            .value
            .trim();


    const cardNumber =
        document
            .getElementById(
                "cardNumber"
            )
            .value
            .replace(
                /\D/g,
                ""
            );


    const message =
        document.getElementById(
            "addMessage"
        );


    const button =
        document.getElementById(
            "addCardButton"
        );


    if (!holderName) {

        showMessage(
            message,
            "نام صاحب کارت را وارد کنید."
        );

        return;

    }


    if (!bankName) {

        showMessage(
            message,
            "نام بانک را وارد کنید."
        );

        return;

    }


    if (
        !/^\d{16}$/.test(
            cardNumber
        )
    ) {

        showMessage(
            message,
            "شماره کارت باید دقیقاً ۱۶ رقم باشد."
        );

        return;

    }


    button.disabled =
        true;

    button.textContent =
        "در حال افزودن...";


    try {

        const response =
            await apiRequest(
                "/api/cards",
                {
                    method:
                        "POST",

                    body:
                        JSON.stringify(
                            {
                                holder_name:
                                    holderName,

                                bank_name:
                                    bankName,

                                card_number:
                                    cardNumber
                            }
                        )
                }
            );


        const data =
            await readResponse(
                response
            );


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "افزودن کارت انجام نشد."
            );

        }


        showMessage(
            message,
            data.message ||
            "کارت با موفقیت اضافه شد.",
            true
        );


        document.getElementById(
            "holderName"
        ).value = "";


        document.getElementById(
            "bankName"
        ).value = "";


        document.getElementById(
            "cardNumber"
        ).value = "";


        await loadCards();


    } catch (
        error
    ) {

        console.error(
            "Add card error:",
            error
        );


        showMessage(
            message,
            error.message ||
            "افزودن کارت انجام نشد."
        );


    } finally {

        button.disabled =
            false;

        button.textContent =
            "افزودن کارت";

    }

}


async function setDefaultCard(
    cardId
) {

    try {

        const response =
            await apiRequest(
                "/api/cards/" +
                cardId +
                "/default",
                {
                    method:
                        "PUT"
                }
            );


        const data =
            await readResponse(
                response
            );


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "تغییر کارت پیش‌فرض انجام نشد."
            );

        }


        await loadCards();


    } catch (
        error
    ) {

        console.error(
            "Default card error:",
            error
        );


        alert(
            error.message ||
            "تغییر کارت پیش‌فرض انجام نشد."
        );

    }

}


async function deleteCard(
    cardId
) {

    const confirmed =
        window.confirm(
            "آیا از حذف این کارت مطمئن هستید؟"
        );


    if (!confirmed) {
        return;
    }


    try {

        const response =
            await apiRequest(
                "/api/cards/" +
                cardId,
                {
                    method:
                        "DELETE"
                }
            );


        const data =
            await readResponse(
                response
            );


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "حذف کارت انجام نشد."
            );

        }


        await loadCards();


    } catch (
        error
    ) {

        console.error(
            "Delete card error:",
            error
        );


        alert(
            error.message ||
            "حذف کارت انجام نشد."
        );

    }

}


document
    .getElementById(
        "addCardButton"
    )
    .addEventListener(
        "click",
        addCard
    );


async function init() {

    if (
        !ensureLoggedIn()
    ) {
        return;
    }

    await loadCards();

}


init();

</script>

</body>

</html>
