<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#2563eb"
    >

    <title>کارت‌های بانکی - کیف‌یار</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }

        .container {
            width: min(
                100%,
                900px
            );

            margin: 0 auto;
            padding: 20px;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
        }

        .page-header h1 {
            margin: 0;
            font-size: 25px;
        }

        .back-link {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
            white-space: nowrap;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .card {
            background: #ffffff;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow:
                0 5px 20px
                rgba(
                    0,
                    0,
                    0,
                    0.05
                );
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        .card p {
            color: #666;
            line-height: 1.8;
        }

        .field {
            margin-top: 14px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            height: 48px;
            border:
                1px solid
                #d1d5db;
            border-radius: 12px;
            padding: 0 12px;
            font-family: inherit;
            font-size: 14px;
            background: #fff;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow:
                0 0 0 3px
                rgba(
                    37,
                    99,
                    235,
                    0.1
                );
        }

        .card-button {
            width: 100%;
            min-height: 50px;
            margin-top: 18px;
            border: none;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-family: inherit;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .card-button:hover {
            background: #1d4ed8;
        }

        .card-button:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        .message {
            display: none;
            margin-top: 14px;
            padding: 12px;
            border-radius: 10px;
            line-height: 1.7;
        }

        .message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .message.info {
            display: block;
            background: #dbeafe;
            color: #1e40af;
        }

        .bank-card {
            border:
                1px solid
                #e5e7eb;
            border-radius: 15px;
            padding: 16px;
            margin-bottom: 12px;
            background: #fafafa;
        }

        .bank-card:last-child {
            margin-bottom: 0;
        }

        .bank-card-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .bank-card-row {
            margin-top: 8px;
            color: #555;
            line-height: 1.8;
        }

        .bank-card-row strong {
            color: #222;
        }

        .default-badge {
            display: inline-block;
            margin-top: 10px;
            padding: 5px 10px;
            border-radius: 999px;
            background: #dcfce7;
            color: #166534;
            font-size: 13px;
            font-weight: bold;
        }

        .normal-badge {
            display: inline-block;
            margin-top: 10px;
            padding: 5px 10px;
            border-radius: 999px;
            background: #f3f4f6;
            color: #555;
            font-size: 13px;
        }

        .bank-card-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }

        .small-button {
            border: none;
            border-radius: 10px;
            padding: 10px 13px;
            font-family: inherit;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }

        .small-button.primary {
            background: #2563eb;
            color: white;
        }

        .small-button.primary:hover {
            background: #1d4ed8;
        }

        .small-button.danger {
            background: #dc2626;
            color: white;
        }

        .small-button.danger:hover {
            background: #b91c1c;
        }

        .small-button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 25px 10px;
            line-height: 1.8;
        }

        .loading {
            color: #777;
            padding: 15px 0;
            text-align: center;
        }

        .error-box {
            padding: 15px;
            border-radius: 12px;
            background: #fee2e2;
            color: #991b1b;
            line-height: 1.8;
        }

        .refresh-button {
            border: 1px solid #d1d5db;
            background: white;
            color: #333;
            border-radius: 10px;
            padding: 9px 13px;
            font-family: inherit;
            cursor: pointer;
            font-weight: bold;
        }

        .refresh-button:hover {
            background: #f3f4f6;
        }

        .list-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 15px;
        }

        .list-header h2 {
            margin: 0;
        }

        @media (
            max-width: 600px
        ) {

            .container {
                padding: 14px;
            }

            .page-header h1 {
                font-size: 21px;
            }

            .page-header {
                align-items: flex-start;
            }

            .list-header {
                align-items: flex-start;
            }

            .bank-card-actions {
                flex-direction: column;
            }

            .small-button {
                width: 100%;
            }

        }

    </style>

</head>


<body>

<div class="container">


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="page-header">

        <h1>
            💳 کارت‌های بانکی
        </h1>

        <a
            href="index.html"
            class="back-link"
        >
            بازگشت
        </a>

    </header>


    <!-- =====================================================
         ADD CARD
         ===================================================== -->

    <section class="card">

        <h2>
            ➕ افزودن کارت بانکی
        </h2>

        <p>
            اطلاعات کارت بانکی خودت را برای استفاده در کیف‌یار ثبت کن.
        </p>


        <div class="field">

            <label for="holderName">
                نام صاحب کارت
            </label>

            <input
                id="holderName"
                type="text"
                maxlength="100"
                autocomplete="name"
                placeholder="نام و نام خانوادگی"
            >

        </div>


        <div class="field">

            <label for="bankName">
                نام بانک
            </label>

            <input
                id="bankName"
                type="text"
                maxlength="100"
                placeholder="مثلاً بانک ملی"
            >

        </div>


        <div class="field">

            <label for="cardNumber">
                شماره کارت
            </label>

            <input
                id="cardNumber"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                maxlength="19"
                placeholder="6037-xxxx-xxxx-xxxx"
            >

        </div>


        <button
            id="addCardButton"
            class="card-button"
            type="button"
        >
            افزودن کارت
        </button>


        <div
            id="addMessage"
            class="message"
            role="alert"
        ></div>

    </section>


    <!-- =====================================================
         CARDS LIST
         ===================================================== -->

    <section class="card">

        <div class="list-header">

            <h2>
                💳 کارت‌های من
            </h2>

            <button
                id="refreshButton"
                class="refresh-button"
                type="button"
            >
                🔄 بروزرسانی
            </button>

        </div>


        <div id="cardsList">

            <div class="loading">
                در حال دریافت کارت‌ها...
            </div>

        </div>

    </section>

</div>


<script>


// =========================================================
// CONFIG
// =========================================================

const API_URL =
    "https://kifyar-api.onrender.com";

const TOKEN_KEY =
    "kifyar_token";


// =========================================================
// GET TOKEN
// =========================================================

function getToken() {

    return (
        localStorage.getItem(
            TOKEN_KEY
        ) || ""
    );

}


// =========================================================
// REDIRECT TO LOGIN
// =========================================================

function redirectToLogin() {

    localStorage.removeItem(
        TOKEN_KEY
    );

    localStorage.removeItem(
        "kifyar_user"
    );

    window.location.href =
        "login.html";

}


// =========================================================
// CHECK LOGIN
// =========================================================

function ensureLoggedIn() {

    const token =
        getToken();

    if (!token) {

        redirectToLogin();

        return false;

    }

    return true;

}


// =========================================================
// AUTH HEADERS
// =========================================================

function authHeaders(
    includeJson = false
) {

    const headers = {

        "Accept":
            "application/json",

        "Authorization":
            "Bearer " +
            getToken()

    };


    if (includeJson) {

        headers[
            "Content-Type"
        ] =
            "application/json";

    }


    return headers;

}


// =========================================================
// READ RESPONSE
// =========================================================

async function readResponse(
    response
) {

    const contentType =
        response.headers.get(
            "content-type"
        ) || "";


    if (
        contentType.includes(
            "application/json"
        )
    ) {

        try {

            return await response.json();

        } catch {

            return {};

        }

    }


    const text =
        await response.text();


    return {
        detail:
            text ||
            "پاسخ نامعتبر از سرور دریافت شد."
    };

}


// =========================================================
// API REQUEST
// =========================================================

async function apiRequest(
    endpoint,
    options = {}
) {

    const response =
        await fetch(
            API_URL +
            endpoint,
            {
                ...options,

                headers: {
                    ...authHeaders(
                        Boolean(
                            options.body
                        )
                    ),

                    ...(options.headers || {})
                }
            }
        );


    if (
        response.status === 401
    ) {

        redirectToLogin();

        throw new Error(
            "جلسه ورود معتبر نیست. دوباره وارد شوید."
        );

    }


    return response;

}


// =========================================================
// MESSAGE
// =========================================================

function showMessage(
    element,
    message,
    type = "error"
) {

    element.textContent =
        message;

    element.className =
        "message " +
        type;

}


// =========================================================
// ESCAPE HTML
// =========================================================

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


// =========================================================
// FORMAT CARD NUMBER
// =========================================================

function formatCardNumber(
    value
) {

    const digits =
        String(
            value || ""
        )
            .replace(
                /\D/g,
                ""
            )
            .slice(
                0,
                16
            );


    const groups = [];


    for (
        let i = 0;
        i < digits.length;
        i += 4
    ) {

        groups.push(
            digits.slice(
                i,
                i + 4
            )
        );

    }


    return groups.join(
        "-"
    );

}


// =========================================================
// CARD NUMBER INPUT
// =========================================================

document
    .getElementById(
        "cardNumber"
    )
    .addEventListener(
        "input",
        function() {

            this.value =
                formatCardNumber(
                    this.value
                );

        }
    );


// =========================================================
// LOAD CARDS
// =========================================================

async function loadCards() {

    const list =
        document.getElementById(
            "cardsList"
        );


    list.innerHTML = `
        <div class="loading">
            در حال دریافت کارت‌ها...
        </div>
    `;


    try {

        const response =
            await apiRequest(
                "/api/cards"
            );


        const data =
            await readResponse(
                response
            );


        if (!response.ok) {

            throw new Error(
                data.detail ||
                data.message ||
                "دریافت کارت‌ها انجام نشد."
            );

        }


        /*
         * Backend may return either:
         *
         * [
         *   {...}
         * ]
         *
         * or:
         *
         * {
         *   "cards": [...]
         * }
         */

        let cards = [];


        if (
            Array.isArray(
                data
            )
        ) {

            cards =
                data;

        } else if (
            Array.isArray(
                data.cards
            )
        ) {

            cards =
                data.cards;

        }


        if (
            cards.length === 0
        ) {

            list.innerHTML = `
                <div class="empty">
                    هنوز هیچ کارت بانکی ثبت نشده است.
                    <br>
                    از بخش بالا یک کارت اضافه کن.
                </div>
            `;

            return;

        }


        list.innerHTML =
            "";


        cards.forEach(
            card => {

                renderCard(
                    list,
                    card
                );

            }
        );


    } catch (
        error
    ) {

        console.error(
            "Load cards error:",
            error
        );


        list.innerHTML = `
            <div class="error-box">
                ${
                    escapeHtml(
                        error.message ||
                        "خطا در دریافت کارت‌ها."
                    )
                }
            </div>
        `;

    }

}


// =========================================================
// RENDER CARD
// =========================================================

function renderCard(
    list,
    card
) {

    const item =
        document.createElement(
            "div"
        );


    item.className =
        "bank-card";


    const cardId =
        Number(
            card.id
        );


    const isDefault =
        Number(
            card.is_default || 0
        ) === 1;


    const bankName =
        card.bank_name ||
        "بانک";


    const holderName =
        card.holder_name ||
        "-";


    const maskedNumber =
        card.masked_card_number ||
        card.card_number_masked ||
        card.card_number ||
        "****";


    const defaultBadge =
        isDefault

            ? `
                <div class="default-badge">
                    ⭐ کارت پیش‌فرض
                </div>
              `

            : `
                <div class="normal-badge">
                    کارت عادی
                </div>
              `;


    const defaultButton =
        !isDefault

            ? `
                <button
                    type="button"
                    class="small-button primary"
                    data-default-card="${cardId}"
                >
                    ⭐ انتخاب به‌عنوان پیش‌فرض
                </button>
              `

            : "";


    item.innerHTML = `

        <div class="bank-card-title">
            💳 ${escapeHtml(
                bankName
            )}
        </div>


        <div class="bank-card-row">
            صاحب کارت:
            <strong>
                ${escapeHtml(
                    holderName
                )}
            </strong>
        </div>


        <div class="bank-card-row">
            شماره کارت:
            <strong>
                ${escapeHtml(
                    maskedNumber
                )}
            </strong>
        </div>


        ${defaultBadge}


        <div class="bank-card-actions">

            ${defaultButton}


            <button
                type="button"
                class="small-button danger"
                data-delete-card="${cardId}"
            >
                🗑 حذف کارت
            </button>

        </div>

    `;


    list.appendChild(
        item
    );

}


// =========================================================
// ADD CARD
// =========================================================

async function addCard() {

    const holderName =
        document
            .getElementById(
                "holderName"
            )
            .value
            .trim();


    const bankName =
        document
            .getElementById(
                "bankName"
            )
            .value
            .trim();


    const cardNumber =
        document
            .getElementById(
                "cardNumber"
            )
            .value
            .replace(
                /\D/g,
                ""
            );


    const message =
        document.getElementById(
            "addMessage"
        );


    const button =
        document.getElementById(
            "addCardButton"
        );


    if (!holderName) {

        showMessage(
            message,
            "نام صاحب کارت را وارد کنید."
        );

        return;

    }


    if (!bankName) {

        showMessage(
            message,
            "نام بانک را وارد کنید."
        );

        return;

    }


    if (
        !/^\d{16}$/.test(
            cardNumber
        )
    ) {

        showMessage(
            message,
            "شماره کارت باید دقیقاً ۱۶ رقم باشد."
        );

        return;

    }


    button.disabled =
        true;

    button.textContent =
        "در حال افزودن...";


    try {

        const response =
            await apiRequest(
                "/api/cards",
                {
                    method:
                        "POST",

                    body:
                        JSON.stringify(
                            {
                                holder_name:
                                    holderName,

                                bank_name:
                                    bankName,

                                card_number:
                                    cardNumber
                            }
                        )
                }
            );


        const data =
            await readResponse(
                response
            );


        if (!response.ok) {

            throw new Error(
                data.detail ||
                data.message ||
                "افزودن کارت انجام نشد."
            );

        }


        showMessage(
            message,
            data.message ||
            "کارت با موفقیت اضافه شد.",
            "success"
        );


        document.getElementById(
            "holderName"
        ).value = "";


        document.getElementById(
            "bankName"
        ).value = "";


        document.getElementById(
            "cardNumber"
        ).value = "";


        await loadCards();


    } catch (
        error
    ) {

        console.error(
            "Add card error:",
            error
        );


        showMessage(
            message,
            error.message ||
            "افزودن کارت انجام نشد.",
            "error"
        );


    } finally {

        button.disabled =
            false;

        button.textContent =
            "افزودن کارت";

    }

}


// =========================================================
// SET DEFAULT CARD
// =========================================================

async function setDefaultCard(
    cardId
) {

    if (
        !Number.isInteger(
            cardId
        ) ||
        cardId <= 0
    ) {

        return;

    }


    try {

        const response =
            await apiRequest(
                "/api/cards/" +
                cardId +
                "/default",
                {
                    method:
                        "PUT"
                }
            );


        const data =
            await readResponse(
                response
            );


        if (!response.ok) {

            throw new Error(
                data.detail ||
                data.message ||
                "تغییر کارت پیش‌فرض انجام نشد."
            );

        }


        await loadCards();


    } catch (
        error
    ) {

        console.error(
            "Default card error:",
            error
        );


        alert(
            error.message ||
            "تغییر کارت پیش‌فرض انجام نشد."
        );

    }

}


// =========================================================
// DELETE CARD
// =========================================================

async function deleteCard(
    cardId
) {

    if (
        !Number.isInteger(
            cardId
        ) ||
        cardId <= 0
    ) {

        return;

    }


    const confirmed =
        window.confirm(
            "آیا از حذف این کارت مطمئن هستید؟"
        );


    if (!confirmed) {

        return;

    }


    try {

        const response =
            await apiRequest(
                "/api/cards/" +
                cardId,
                {
                    method:
                        "DELETE"
                }
            );


        const data =
            await readResponse(
                response
            );


        if (!response.ok) {

            throw new Error(
                data.detail ||
                data.message ||
                "حذف کارت انجام نشد."
            );

        }


        await loadCards();


    } catch (
        error
    ) {

        console.error(
            "Delete card error:",
            error
        );


        alert(
            error.message ||
            "حذف کارت انجام نشد."
        );

    }

}


// =========================================================
// CARD ACTIONS
// =========================================================

document.addEventListener(
    "click",
    function(event) {

        const defaultButton =
            event.target.closest(
                "[data-default-card]"
            );


        if (defaultButton) {

            const cardId =
                Number(
                    defaultButton.dataset
                        .defaultCard
                );


            setDefaultCard(
                cardId
            );

            return;

        }


        const deleteButton =
            event.target.closest(
                "[data-delete-card]"
            );


        if (deleteButton) {

            const cardId =
                Number(
                    deleteButton.dataset
                        .deleteCard
                );


            deleteCard(
                cardId
            );

        }

    }
);


// =========================================================
// ADD BUTTON
// =========================================================

document
    .getElementById(
        "addCardButton"
    )
    .addEventListener(
        "click",
        addCard
    );


// =========================================================
// REFRESH BUTTON
// =========================================================

document
    .getElementById(
        "refreshButton"
    )
    .addEventListener(
        "click",
        loadCards
    );


// =========================================================
// ENTER KEY
// =========================================================

document
    .getElementById(
        "cardNumber"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key ===
                "Enter"
            ) {

                addCard();

            }

        }
    );


// =========================================================
// INIT
// =========================================================

async function init() {

    if (
        !ensureLoggedIn()
    ) {

        return;

    }


    await loadCards();

}


init();

</script>

</body>

</html>
