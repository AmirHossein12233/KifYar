<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تراکنش‌ها | KifYar</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Tahoma, Arial, sans-serif;
            background: #f4f6f8;
            color: #111827;
        }

        .container {
            width: 100%;
            max-width: 750px;
            margin: 0 auto;
        }

        .header {
            background: #111827;
            color: white;
            padding: 22px;
            border-radius: 20px;
            margin-bottom: 18px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 25px;
        }

        .header p {
            margin: 0;
            color: #cbd5e1;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .summary-item {
            background: #f8fafc;
            border-radius: 14px;
            padding: 15px;
            text-align: center;
        }

        .summary-item span {
            display: block;
            color: #64748b;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .summary-item strong {
            font-size: 17px;
        }

        .transaction {
            border: 1px solid #e5e7eb;
            border-radius: 15px;
            padding: 16px;
            margin-bottom: 12px;
            background: #fff;
        }

        .transaction:last-child {
            margin-bottom: 0;
        }

        .transaction-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .transaction-title {
            font-size: 16px;
            font-weight: bold;
        }

        .amount {
            font-size: 17px;
            font-weight: bold;
        }

        .amount.plus {
            color: #15803d;
        }

        .amount.minus {
            color: #dc2626;
        }

        .transaction-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 5px 0;
            font-size: 13px;
        }

        .transaction-row span:first-child {
            color: #64748b;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            background: #e5e7eb;
            font-size: 12px;
            font-weight: bold;
        }

        .status.completed,
        .status.success {
            background: #dcfce7;
            color: #166534;
        }

        .status.pending,
        .status.processing {
            background: #fef3c7;
            color: #92400e;
        }

        .status.failed,
        .status.rejected,
        .status.cancelled {
            background: #fee2e2;
            color: #991b1b;
        }

        .empty {
            text-align: center;
            color: #64748b;
            padding: 30px 10px;
        }

        .message {
            display: none;
            padding: 13px;
            border-radius: 12px;
            margin-bottom: 18px;
            line-height: 1.8;
        }

        .message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            border: 0;
            border-radius: 13px;
            padding: 14px;
            font-family: inherit;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .secondary {
            background: #e5e7eb;
            color: #111827;
        }

        @media (max-width: 600px) {

            body {
                padding: 12px;
            }

            .summary {
                grid-template-columns: 1fr;
            }

            .buttons {
                grid-template-columns: 1fr;
            }

            .transaction-top {
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📋 تراکنش‌های من</h1>
        <p>تاریخچه فعالیت‌های مالی کیف‌یار</p>
    </div>

    <div id="message" class="message"></div>

    <!-- SUMMARY -->

    <div class="card">

        <h2>💰 خلاصه حساب</h2>

        <div class="summary">

            <div class="summary-item">
                <span>موجودی</span>
                <strong id="balance">۰ تومان</strong>
            </div>

            <div class="summary-item">
                <span>دریافتی‌ها</span>
                <strong id="income">۰ تومان</strong>
            </div>

            <div class="summary-item">
                <span>پرداختی‌ها</span>
                <strong id="expense">۰ تومان</strong>
            </div>

        </div>

    </div>

    <!-- BUTTONS -->

    <div class="card">

        <div class="buttons">

            <button
                class="primary"
                type="button"
                onclick="window.location.href='withdraw.html'"
            >
                💳 برداشت وجه
            </button>

            <button
                class="secondary"
                type="button"
                onclick="loadAll()"
            >
                🔄 بروزرسانی
            </button>

        </div>

    </div>

    <!-- TRANSACTIONS -->

    <div class="card">

        <h2>تاریخچه تراکنش‌ها</h2>

        <div id="transactions">

            <div class="empty">
                در حال دریافت تراکنش‌ها...
            </div>

        </div>

    </div>

</div>

<script>

const API_URL =
    "https://kifyar-api.onrender.com";


/* =========================================================
   TOKEN
========================================================= */

function getToken() {

    return (
        localStorage.getItem("token") ||
        localStorage.getItem("access_token") ||
        localStorage.getItem("kifyar_token") ||
        ""
    );
}


/* =========================================================
   HEADERS
========================================================= */

function getHeaders() {

    const token =
        getToken();

    const headers = {
        "Content-Type": "application/json"
    };

    if (token) {

        headers["Authorization"] =
            "Bearer " + token;
    }

    return headers;
}


/* =========================================================
   API
========================================================= */

async function apiFetch(url, options = {}) {

    const response =
        await fetch(
            API_URL + url,
            {
                ...options,

                headers: {
                    ...getHeaders(),
                    ...(options.headers || {})
                }
            }
        );

    let data = {};

    try {

        data =
            await response.json();

    } catch {

        data = {};
    }

    if (!response.ok) {

        throw new Error(
            data.detail ||
            data.message ||
            data.error ||
            "خطا در ارتباط با سرور"
        );
    }

    return data;
}


/* =========================================================
   MONEY
========================================================= */

function formatMoney(value) {

    const number =
        Number(value || 0);

    return (
        new Intl.NumberFormat("fa-IR")
            .format(number)
        + " تومان"
    );
}


/* =========================================================
   HTML SECURITY
========================================================= */

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* =========================================================
   STATUS
========================================================= */

function statusText(status) {

    const value =
        String(status || "")
            .toLowerCase();

    const map = {

        completed:
            "تکمیل شده",

        success:
            "موفق",

        pending:
            "در انتظار",

        processing:
            "در حال پردازش",

        failed:
            "ناموفق",

        rejected:
            "رد شده",

        cancelled:
            "لغو شده",

        canceled:
            "لغو شده"
    };

    return (
        map[value] ||
        status ||
        "نامشخص"
    );
}


function statusClass(status) {

    const value =
        String(status || "")
            .toLowerCase();

    if (
        value === "completed" ||
        value === "success"
    ) {
        return "completed";
    }

    if (
        value === "pending" ||
        value === "processing"
    ) {
        return value;
    }

    if (
        value === "failed" ||
        value === "rejected" ||
        value === "cancelled" ||
        value === "canceled"
    ) {
        return value;
    }

    return "";
}


/* =========================================================
   TRANSACTION TYPE
========================================================= */

function transactionTitle(item) {

    const type =
        String(
            item.type ||
            item.transaction_type ||
            item.kind ||
            item.category ||
            ""
        ).toLowerCase();

    if (
        type.includes("deposit") ||
        type.includes("charge") ||
        type.includes("credit") ||
        type.includes("income")
    ) {
        return "💰 افزایش موجودی";
    }

    if (
        type.includes("withdraw") ||
        type.includes("payout")
    ) {
        return "💳 برداشت وجه";
    }

    if (
        type.includes("transfer")
    ) {
        return "💸 انتقال وجه";
    }

    if (
        type.includes("purchase") ||
        type.includes("payment") ||
        type.includes("debit")
    ) {
        return "🛒 پرداخت";
    }

    return (
        item.title ||
        item.description ||
        "تراکنش کیف پول"
    );
}


/* =========================================================
   TRANSACTION AMOUNT
========================================================= */

function getAmount(item) {

    return Number(
        item.amount ??
        item.value ??
        item.total ??
        0
    );
}


function isIncome(item) {

    const amount =
        getAmount(item);

    if (
        item.direction === "in" ||
        item.direction === "credit" ||
        item.is_credit === true
    ) {
        return true;
    }

    if (
        item.direction === "out" ||
        item.direction === "debit" ||
        item.is_debit === true
    ) {
        return false;
    }

    const type =
        String(
            item.type ||
            item.transaction_type ||
            item.kind ||
            ""
        ).toLowerCase();

    if (
        type.includes("deposit") ||
        type.includes("charge") ||
        type.includes("credit") ||
        type.includes("income")
    ) {
        return true;
    }

    if (
        type.includes("withdraw") ||
        type.includes("payout") ||
        type.includes("payment") ||
        type.includes("debit")
    ) {
        return false;
    }

    return amount >= 0;
}


/* =========================================================
   BALANCE
========================================================= */

async function loadBalance() {

    try {

        const data =
            await apiFetch(
                "/api/balance"
            );

        const balance =
            data.balance ??
            data.current_balance ??
            0;

        document.getElementById(
            "balance"
        ).textContent =
            formatMoney(balance);

    } catch (error) {

        console.error(
            "Balance error:",
            error
        );

        document.getElementById(
            "balance"
        ).textContent =
            "خطا";
    }
}


/* =========================================================
   TRANSACTIONS
========================================================= */

async function loadTransactions() {

    const container =
        document.getElementById(
            "transactions"
        );

    try {

        const data =
            await apiFetch(
                "/api/transactions"
            );

        let transactions =
            Array.isArray(data)
                ? data
                : (
                    data.transactions ||
                    data.items ||
                    data.data ||
                    []
                );

        if (!Array.isArray(transactions)) {

            transactions = [];
        }

        container.innerHTML = "";

        let income = 0;
        let expense = 0;

        transactions.forEach(item => {

            const amount =
                Math.abs(
                    getAmount(item)
                );

            if (isIncome(item)) {

                income += amount;

            } else {

                expense += amount;
            }
        });

        document.getElementById(
            "income"
        ).textContent =
            formatMoney(income);

        document.getElementById(
            "expense"
        ).textContent =
            formatMoney(expense);


        if (!transactions.length) {

            container.innerHTML = `
                <div class="empty">
                    هنوز تراکنشی ثبت نشده است.
                </div>
            `;

            return;
        }


        transactions.forEach(item => {

            const amount =
                Math.abs(
                    getAmount(item)
                );

            const incomeTransaction =
                isIncome(item);

            const status =
                item.status ||
                item.state ||
                "completed";

            const transactionId =
                item.id ??
                item.transaction_id ??
                "-";

            const description =
                item.description ||
                item.note ||
                "";

            const createdAt =
                item.created_at ||
                item.date ||
                item.created ||
                "";

            const balanceAfter =
                item.balance_after ??
                item.result_balance ??
                item.new_balance;


            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "transaction";


            div.innerHTML = `

                <div class="transaction-top">

                    <div class="transaction-title">
                        ${escapeHtml(
                            transactionTitle(item)
                        )}
                    </div>

                    <div class="amount ${
                        incomeTransaction
                            ? "plus"
                            : "minus"
                    }">

                        ${
                            incomeTransaction
                                ? "+"
                                : "-"
                        }

                        ${formatMoney(amount)}

                    </div>

                </div>


                <div class="transaction-row">

                    <span>شناسه</span>

                    <strong>
                        ${escapeHtml(
                            String(transactionId)
                        )}
                    </strong>

                </div>


                <div class="transaction-row">

                    <span>وضعیت</span>

                    <span class="status ${
                        statusClass(status)
                    }">

                        ${escapeHtml(
                            statusText(status)
                        )}

                    </span>

                </div>


                ${
                    description
                        ? `
                            <div class="transaction-row">

                                <span>توضیح</span>

                                <strong>
                                    ${escapeHtml(
                                        String(
                                            description
                                        )
                                    )}
                                </strong>

                            </div>
                        `
                        : ""
                }


                ${
                    createdAt
                        ? `
                            <div class="transaction-row">

                                <span>تاریخ</span>

                                <strong>
                                    ${escapeHtml(
                                        String(
                                            createdAt
                                        )
                                    )}
                                </strong>

                            </div>
                        `
                        : ""
                }


                ${
                    balanceAfter !== undefined &&
                    balanceAfter !== null
                        ? `
                            <div class="transaction-row">

                                <span>
                                    موجودی پس از تراکنش
                                </span>

                                <strong>
                                    ${formatMoney(
                                        balanceAfter
                                    )}
                                </strong>

                            </div>
                        `
                        : ""
                }

            `;

            container.appendChild(div);
        });

    } catch (error) {

        console.error(
            "Transactions error:",
            error
        );

        container.innerHTML = `
            <div class="empty">
                دریافت تراکنش‌ها ناموفق بود.
                <br><br>
                ${escapeHtml(
                    error.message ||
                    "خطای نامشخص"
                )}
            </div>
        `;

        showMessage(
            error.message ||
            "دریافت تراکنش‌ها ناموفق بود.",
            "error"
        );
    }
}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text, type) {

    const element =
        document.getElementById(
            "message"
        );

    element.textContent =
        text;

    element.className =
        "message " + type;
}


/* =========================================================
   LOAD ALL
========================================================= */

async function loadAll() {

    await Promise.all([
        loadBalance(),
        loadTransactions()
    ]);
}


/* =========================================================
   AUTH
========================================================= */

async function checkAuth() {

    const token =
        getToken();

    if (!token) {

        showMessage(
            "ابتدا وارد حساب خود شوید.",
            "error"
        );

        setTimeout(() => {

            window.location.href =
                "login.html";

        }, 1200);

        return false;
    }

    return true;
}


/* =========================================================
   START
========================================================= */

async function startPage() {

    const authenticated =
        await checkAuth();

    if (!authenticated) {
        return;
    }

    await loadAll();
}


window.addEventListener(
    "DOMContentLoaded",
    startPage
);

</script>

</body>
</html>
