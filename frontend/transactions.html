<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تراکنش‌ها | کیف‌یار</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        .container {
            width: min(1100px, 94%);
            margin: 0 auto;
            padding: 24px 0 50px;
        }

        .header {
            background: white;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        h1 {
            margin: 0;
            font-size: 25px;
        }

        .subtitle {
            margin-top: 8px;
            color: #6b7280;
            font-size: 14px;
        }

        .back-button {
            border: none;
            background: #111827;
            color: white;
            padding: 11px 17px;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .back-button:hover {
            opacity: 0.9;
        }

        .filters {
            background: white;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
        }

        .filters-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        label {
            font-size: 13px;
            color: #4b5563;
        }

        input,
        select {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 11px;
            padding: 11px 12px;
            background: white;
            color: #111827;
            outline: none;
            font-family: inherit;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
        }

        .filter-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .button {
            border: none;
            border-radius: 11px;
            padding: 11px 18px;
            cursor: pointer;
            font-family: inherit;
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .secondary {
            background: #e5e7eb;
            color: #111827;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 11px;
            margin-top: 15px;
            font-size: 14px;
        }

        .message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .summary-card {
            background: white;
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
        }

        .summary-label {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .summary-value {
            font-size: 22px;
            font-weight: bold;
        }

        .income {
            color: #15803d;
        }

        .expense {
            color: #dc2626;
        }

        .count {
            color: #2563eb;
        }

        .transactions-box {
            background: white;
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
        }

        .transactions-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .transactions-title {
            font-size: 19px;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 35px 10px;
            color: #6b7280;
        }

        .empty {
            text-align: center;
            padding: 45px 10px;
            color: #6b7280;
        }

        .transaction-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .transaction {
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .transaction-right {
            min-width: 0;
            flex: 1;
        }

        .transaction-title {
            font-weight: bold;
            margin-bottom: 7px;
            word-break: break-word;
        }

        .transaction-meta {
            color: #6b7280;
            font-size: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .transaction-left {
            text-align: left;
            white-space: nowrap;
        }

        .transaction-amount {
            font-size: 16px;
            font-weight: bold;
        }

        .transaction-type {
            margin-top: 5px;
            font-size: 12px;
        }

        .amount-income {
            color: #15803d;
        }

        .amount-expense {
            color: #dc2626;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 11px;
            background: #f3f4f6;
            color: #4b5563;
        }

        .wallet-badge {
            background: #dbeafe;
            color: #1d4ed8;
        }

        @media (max-width: 800px) {
            .filter-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .summary {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 560px) {
            .container {
                width: 92%;
                padding-top: 15px;
            }

            .filter-grid {
                grid-template-columns: 1fr;
            }

            .transaction {
                align-items: flex-start;
            }

            .transaction-left {
                text-align: right;
            }

            .transaction-amount {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="header-top">
            <div>
                <h1>💳 تراکنش‌ها</h1>
                <div class="subtitle">
                    تمام درآمدها، هزینه‌ها و برداشت‌های کیف پول شما
                </div>
            </div>

            <a class="back-button" href="index.html">
                ← بازگشت به داشبورد
            </a>
        </div>
    </div>

    <div class="filters">

        <div class="filters-title">
            🔎 جستجو و فیلتر
        </div>

        <div class="filter-grid">

            <div class="field">
                <label for="searchInput">جستجو</label>
                <input
                    id="searchInput"
                    type="text"
                    placeholder="عنوان تراکنش..."
                >
            </div>

            <div class="field">
                <label for="typeFilter">نوع تراکنش</label>
                <select id="typeFilter">
                    <option value="">همه</option>
                    <option value="income">درآمد</option>
                    <option value="expense">هزینه</option>
                </select>
            </div>

            <div class="field">
                <label for="categoryFilter">دسته‌بندی</label>
                <select id="categoryFilter">
                    <option value="">همه دسته‌ها</option>
                    <option value="other">سایر</option>
                    <option value="shopping">خرید</option>
                    <option value="food">غذا</option>
                    <option value="transport">حمل‌ونقل</option>
                    <option value="bill">قبض</option>
                    <option value="entertainment">سرگرمی</option>
                    <option value="education">آموزش</option>
                </select>
            </div>

            <div class="field">
                <label for="dateFilter">تاریخ</label>
                <input
                    id="dateFilter"
                    type="date"
                >
            </div>

        </div>

        <div class="filter-actions">

            <button
                class="button primary"
                onclick="applyFilters()"
            >
                اعمال فیلتر
            </button>

            <button
                class="button secondary"
                onclick="clearFilters()"
            >
                پاک کردن فیلتر
            </button>

            <button
                class="button secondary"
                onclick="loadTransactions()"
            >
                🔄 بروزرسانی
            </button>

        </div>

        <div id="message" class="message"></div>

    </div>

    <div class="summary">

        <div class="summary-card">
            <div class="summary-label">
                مجموع درآمد
            </div>

            <div
                id="totalIncome"
                class="summary-value income"
            >
                ۰ تومان
            </div>
        </div>

        <div class="summary-card">
            <div class="summary-label">
                مجموع هزینه
            </div>

            <div
                id="totalExpense"
                class="summary-value expense"
            >
                ۰ تومان
            </div>
        </div>

        <div class="summary-card">
            <div class="summary-label">
                تعداد تراکنش
            </div>

            <div
                id="transactionCount"
                class="summary-value count"
            >
                ۰
            </div>
        </div>

    </div>

    <div class="transactions-box">

        <div class="transactions-header">
            <div class="transactions-title">
                📋 فهرست تراکنش‌ها
            </div>
        </div>

        <div id="loading" class="loading">
            در حال دریافت تراکنش‌ها...
        </div>

        <div
            id="empty"
            class="empty"
            style="display:none;"
        >
            هنوز تراکنشی ثبت نشده است.
        </div>

        <div
            id="transactionList"
            class="transaction-list"
        ></div>

    </div>

</div>

<script>

const API_URL = "http://127.0.0.1:8000";

const token = localStorage.getItem("kifyar_token");

let allTransactions = [];

if (!token) {
    window.location.href = "login.html";
}

function formatNumber(value) {
    const number = Number(value || 0);

    return number.toLocaleString("fa-IR");
}

function formatMoney(value) {
    return formatNumber(value) + " تومان";
}

function normalizeType(type) {
    if (!type) {
        return "";
    }

    const value = String(type).toLowerCase().trim();

    if (
        value === "income" ||
        value === "deposit" ||
        value === "credit"
    ) {
        return "income";
    }

    if (
        value === "expense" ||
        value === "withdraw" ||
        value === "debit"
    ) {
        return "expense";
    }

    return value;
}

function categoryName(category) {

    const categories = {
        other: "سایر",
        shopping: "خرید",
        food: "غذا",
        transport: "حمل‌ونقل",
        bill: "قبض",
        entertainment: "سرگرمی",
        education: "آموزش"
    };

    return categories[category] || category || "سایر";
}

function showMessage(text, type = "success") {

    const message = document.getElementById("message");

    message.textContent = text;
    message.className = "message " + type;

    setTimeout(() => {
        message.className = "message";
    }, 3500);
}

function formatDate(value) {

    if (!value) {
        return "بدون تاریخ";
    }

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
        return String(value);
    }

    return date.toLocaleString("fa-IR");
}

async function loadTransactions() {

    const loading = document.getElementById("loading");
    const empty = document.getElementById("empty");
    const list = document.getElementById("transactionList");

    loading.style.display = "block";
    empty.style.display = "none";
    list.innerHTML = "";

    try {

        const response = await fetch(
            API_URL + "/api/transactions",
            {
                method: "GET",
                headers: {
                    "Authorization": "Bearer " + token
                }
            }
        );

        if (response.status === 401) {
            localStorage.removeItem("kifyar_token");
            window.location.href = "login.html";
            return;
        }

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.detail || "دریافت تراکنش‌ها ناموفق بود."
            );
        }

        if (Array.isArray(data)) {
            allTransactions = data;
        } else if (Array.isArray(data.transactions)) {
            allTransactions = data.transactions;
        } else {
            allTransactions = [];
        }

        renderTransactions(allTransactions);

    } catch (error) {

        loading.style.display = "none";

        list.innerHTML = "";

        showMessage(
            error.message || "خطا در دریافت تراکنش‌ها.",
            "error"
        );
    }
}

function renderTransactions(transactions) {

    const loading = document.getElementById("loading");
    const empty = document.getElementById("empty");
    const list = document.getElementById("transactionList");

    loading.style.display = "none";
    list.innerHTML = "";

    updateSummary(transactions);

    if (!transactions.length) {

        empty.style.display = "block";

        return;
    }

    empty.style.display = "none";

    transactions.forEach(transaction => {

        const item = document.createElement("div");

        item.className = "transaction";

        const rawType =
            transaction.transaction_type ??
            transaction.type ??
            "";

        const type = normalizeType(rawType);

        const amount = Number(
            transaction.amount || 0
        );

        const title =
            transaction.title ||
            "تراکنش بدون عنوان";

        const category =
            transaction.category ||
            "other";

        const createdAt =
            transaction.created_at ||
            transaction.date ||
            transaction.createdAt ||
            "";

        const isWalletWithdrawal =
            type === "expense" &&
            (
                title.includes("برداشت") ||
                title.includes("کیف پول")
            );

        const amountClass =
            type === "income"
                ? "amount-income"
                : "amount-expense";

        const sign =
            type === "income"
                ? "+"
                : "-";

        const typeText =
            type === "income"
                ? "درآمد"
                : type === "expense"
                    ? "هزینه"
                    : "تراکنش";

        const walletBadge =
            isWalletWithdrawal
                ? `
                    <span class="badge wallet-badge">
                        برداشت کیف پول
                    </span>
                  `
                : "";

        item.innerHTML = `
            <div class="transaction-right">

                <div class="transaction-title">
                    ${escapeHtml(title)}
                </div>

                <div class="transaction-meta">

                    <span class="badge">
                        ${escapeHtml(categoryName(category))}
                    </span>

                    ${walletBadge}

                    <span>
                        ${escapeHtml(formatDate(createdAt))}
                    </span>

                </div>

            </div>

            <div class="transaction-left">

                <div class="transaction-amount ${amountClass}">
                    ${sign}${formatMoney(amount)}
                </div>

                <div class="transaction-type ${amountClass}">
                    ${typeText}
                </div>

            </div>
        `;

        list.appendChild(item);
    });
}

function updateSummary(transactions) {

    let income = 0;
    let expense = 0;

    transactions.forEach(transaction => {

        const amount = Number(
            transaction.amount || 0
        );

        const type = normalizeType(
            transaction.transaction_type ??
            transaction.type ??
            ""
        );

        if (type === "income") {
            income += amount;
        }

        if (type === "expense") {
            expense += amount;
        }
    });

    document.getElementById("totalIncome").textContent =
        formatMoney(income);

    document.getElementById("totalExpense").textContent =
        formatMoney(expense);

    document.getElementById("transactionCount").textContent =
        formatNumber(transactions.length);
}

function applyFilters() {

    const search =
        document.getElementById("searchInput")
            .value
            .trim()
            .toLowerCase();

    const type =
        document.getElementById("typeFilter").value;

    const category =
        document.getElementById("categoryFilter").value;

    const date =
        document.getElementById("dateFilter").value;

    const filtered = allTransactions.filter(transaction => {

        const title =
            String(transaction.title || "")
                .toLowerCase();

        const transactionType =
            normalizeType(
                transaction.transaction_type ??
                transaction.type ??
                ""
            );

        const transactionCategory =
            String(
                transaction.category || "other"
            );

        const createdAt =
            transaction.created_at ||
            transaction.date ||
            transaction.createdAt ||
            "";

        let matchesSearch = true;
        let matchesType = true;
        let matchesCategory = true;
        let matchesDate = true;

        if (search) {
            matchesSearch =
                title.includes(search);
        }

        if (type) {
            matchesType =
                transactionType === type;
        }

        if (category) {
            matchesCategory =
                transactionCategory === category;
        }

        if (date) {

            if (createdAt) {

                const transactionDate =
                    new Date(createdAt);

                if (!Number.isNaN(transactionDate.getTime())) {

                    const year =
                        transactionDate.getFullYear();

                    const month =
                        String(
                            transactionDate.getMonth() + 1
                        ).padStart(2, "0");

                    const day =
                        String(
                            transactionDate.getDate()
                        ).padStart(2, "0");

                    const localDate =
                        `${year}-${month}-${day}`;

                    matchesDate =
                        localDate === date;

                } else {

                    matchesDate = true;
                }

            } else {

                matchesDate = false;
            }
        }

        return (
            matchesSearch &&
            matchesType &&
            matchesCategory &&
            matchesDate
        );
    });

    renderTransactions(filtered);
}

function clearFilters() {

    document.getElementById("searchInput").value = "";
    document.getElementById("typeFilter").value = "";
    document.getElementById("categoryFilter").value = "";
    document.getElementById("dateFilter").value = "";

    renderTransactions(allTransactions);
}

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

document
    .getElementById("searchInput")
    .addEventListener("input", applyFilters);

document
    .getElementById("typeFilter")
    .addEventListener("change", applyFilters);

document
    .getElementById("categoryFilter")
    .addEventListener("change", applyFilters);

document
    .getElementById("dateFilter")
    .addEventListener("change", applyFilters);

loadTransactions();

</script>

</body>
</html>
